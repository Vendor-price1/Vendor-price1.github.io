<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gee Impex Production Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
    font-family: Arial;
    background:#f4f6f9;
    margin:20px;
}

h2{
    text-align:center;
}

.controls{
    margin-bottom:15px;
    text-align:center;
}

button{
    padding:8px 15px;
    margin:5px;
    background:#2f60d3;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:4px;
}

.kpi-container{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.kpi{
    flex:1 1 150px;
    background:#2f60d3;
    color:white;
    padding:10px;
    border-radius:8px;
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:black;
    color:white;
    padding:8px;
    font-size:13px;
}

td{
    padding:6px;
    text-align:center;
    border:1px solid #ccc;
}

tfoot td{
    font-weight:bold;
    background:#eee;
}
</style>
</head>

<body>

<h2>Gee Impex Production Dashboard</h2>

<div class="controls">
    <button onclick="printReport()">Print</button>
    <button onclick="exportExcel()">Export Excel</button>
</div>

<div class="kpi-container" id="kpiContainer"></div>

<table id="dataTable">
<thead></thead>
<tbody></tbody>
<tfoot></tfoot>
</table>

<script>

const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let fullData=[];
let headers=[];
let lockedRows = JSON.parse(localStorage.getItem("lockedRows") || "{}");

fetch(sheetURL)
.then(res=>res.text())
.then(csv=>{
    const rows = csv.split("\n").map(r=>r.split(","));
    headers = rows[0];
    fullData = rows.slice(1);
    renderTable(fullData);
    renderKPI(fullData);
});

function renderTable(data){

let thead="<tr><th>Select</th>";
headers.forEach(h=>thead+="<th>"+h+"</th>");
thead+="</tr>";
document.querySelector("#dataTable thead").innerHTML=thead;

let tbody="";
data.forEach((row,i)=>{

let locked = lockedRows[i] ? "disabled" : "";

tbody+="<tr>";
tbody+=`<td><input type="checkbox" ${locked} onchange="lockRow(${i},this)"></td>`;
row.forEach(cell=> tbody+="<td>"+cell+"</td>");
tbody+="</tr>";
});
document.querySelector("#dataTable tbody").innerHTML=tbody;

renderTotal(data);
}

function renderTotal(data){

let numericIndex = headers.map((h,i)=>isNumericColumn(i,data)?i:null).filter(v=>v!==null);

let trow="<tr><td>Total</td>";

headers.forEach((h,i)=>{

// REMOVE total for Qty Received Date & Rate
if(h.trim()=="Qty Received Date" || h.trim()=="Rate"){
    trow+="<td></td>";
}
else if(numericIndex.includes(i)){
    let total = data.reduce((sum,row)=> sum + Number(row[i]||0),0);
    trow+="<td>"+total+"</td>";
}
else{
    trow+="<td></td>";
}

});

trow+="</tr>";

document.querySelector("#dataTable tfoot").innerHTML=trow;
}

function renderKPI(data){

let container=document.getElementById("kpiContainer");
container.innerHTML="";

headers.forEach((h,i)=>{

if(isNumericColumn(i,data) && h.trim()!="Qty Received Date" && h.trim()!="Rate"){

let total=data.reduce((sum,row)=>sum+Number(row[i]||0),0);

container.innerHTML+=`
<div class="kpi">
<div>${h}</div>
<div>${total}</div>
</div>
`;

}

});
}

function isNumericColumn(index,data){
return data.every(row=>!isNaN(row[index]) && row[index]!="");
}

function lockRow(index,checkbox){

if(checkbox.checked){

let pass = prompt("Enter Password to Lock Row:");
if(pass==="123"){
lockedRows[index]=true;
localStorage.setItem("lockedRows",JSON.stringify(lockedRows));
renderTable(fullData);
}
else{
alert("Wrong Password");
checkbox.checked=false;
}

}else{

let pass = prompt("Enter Password to Unlock Row:");
if(pass==="123"){
delete lockedRows[index];
localStorage.setItem("lockedRows",JSON.stringify(lockedRows));
renderTable(fullData);
}
else{
alert("Wrong Password");
checkbox.checked=true;
}

}

}

function printReport(){
window.print();
}

function exportExcel(){

let table = document.getElementById("dataTable");
let wb = XLSX.utils.table_to_book(table,{sheet:"Sheet1"});
XLSX.writeFile(wb,"Gee_Impex_Production.xlsx");

}

</script>

</body>
</html>
