<!DOCTYPE html>
<html>
<head>
<title>Gee Impex ERP Dashboard</title>

<style>
body{
margin:0;
font-family: "Segoe UI", Arial;
background:#f1f5f9;
}

/* SIDEBAR */
#sidebar{
width:220px;
height:100vh;
background:#0f172a;
color:#fff;
position:fixed;
padding:15px;
}

#sidebar h3{
text-align:center;
margin-bottom:20px;
}

#sidebar a{
display:block;
color:#cbd5f5;
text-decoration:none;
padding:10px;
border-radius:6px;
margin:4px 0;
}
#sidebar a:hover{
background:#2563eb;
color:#fff;
}

/* MAIN CONTENT */
#main{
margin-left:240px;
padding:15px;
}

/* TOP BAR */
#topbar{
background:#fff;
padding:10px 15px;
border-radius:8px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
display:flex;
justify-content:space-between;
align-items:center;
}

/* KPI CARDS */
.kpi{
display:inline-block;
background:#fff;
padding:15px;
margin:10px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
min-width:150px;
font-weight:bold;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:10px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

th,td{
border:1px solid #e5e7eb;
padding:8px;
font-size:12px;
}

th{
background:#2563eb;
color:#fff;
}

/* PAGINATION */
#pagination button{
padding:5px 10px;
margin:2px;
background:#e5e7eb;
border:none;
border-radius:5px;
}
#pagination button.active{
background:#2563eb;
color:#fff;
}

/* FOOTER */
footer{
text-align:center;
font-size:12px;
margin-top:10px;
color:#555;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar">
<h3>Gee Impex ERP</h3>
<a href="#">📊 Dashboard</a>
<a href="#">📦 Orders</a>
<a href="#">📑 Reports</a>
<a href="#">🏭 Inventory</a>
<a href="#">⚙ Settings</a>
</div>

<!-- MAIN AREA -->
<div id="main">

<!-- TOP BAR -->
<div id="topbar">
<div><b>Gee Impex Production Dashboard</b></div>
<div>
<input id="searchInput" placeholder="Search..." onkeyup="searchTable()">
<button onclick="logout()">Logout</button>
</div>
</div>

<!-- KPI -->
<div id="kpis"></div>

<!-- TABLE -->
<table id="dataTable">
<thead></thead>
<tbody></tbody>
<tfoot></tfoot>
</table>

<div id="pagination"></div>

<footer>Created by: Vijay Pandey</footer>

</div>

<script>
// ===== SESSION LOGIN =====
if(!sessionStorage.getItem("loggedIn")){
alert("Please Login First");
}

// LOGOUT
function logout(){
sessionStorage.removeItem("loggedIn");
location.reload();
}

// GOOGLE SHEET CSV
const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let headers=[], originalRows=[], allRows=[];
let rowsPerPage=25, currentPage=1;

// LOAD DATA
fetch(sheetURL).then(r=>r.text()).then(data=>{
let rows=data.split("\n").map(r=>r.split(","));
headers=rows[0].map(h=>h.trim());
originalRows=rows.slice(1);
allRows=[...originalRows];
buildHeader();
showPage(1);
});

// HEADER
function buildHeader(){
let h="<tr>";
headers.forEach(c=>{
if(["Rate","Amount","Status","Qty Received","Qty Received Date"].includes(c)) return;
h+="<th>"+c+"</th>";
});
h+="</tr>";
document.querySelector("thead").innerHTML=h;
}

// PAGE LOAD
function showPage(p){
currentPage=p;
let start=(p-1)*rowsPerPage;
let pageRows=allRows.slice(start,start+rowsPerPage);

let b="";
pageRows.forEach(r=>{
b+="<tr>";
r.forEach((c,i)=>{
if(["Rate","Amount","Status","Qty Received","Qty Received Date"].includes(headers[i])) return;
b+="<td>"+c+"</td>";
});
b+="</tr>";
});
document.querySelector("tbody").innerHTML=b;
makePagination();
}

// PAGINATION
function makePagination(){
let totalPages=Math.ceil(allRows.length/rowsPerPage);
let h="";
for(let i=1;i<=totalPages;i++){
h+=`<button class="${i==currentPage?'active':''}" onclick="showPage(${i})">${i}</button>`;
}
pagination.innerHTML=h;
}

// SEARCH FIX
function searchTable(){
let v=searchInput.value.toLowerCase();
if(v==="") allRows=[...originalRows];
else allRows=originalRows.filter(r=>r.join(" ").toLowerCase().includes(v));
showPage(1);
}
</script>

</body>
</html>
