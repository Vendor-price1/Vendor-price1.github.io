<!DOCTYPE html>
<html>
<head>
<title>Gee Impex Dashboard</title>
<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:10px;
}

#loginBox{
width:300px;
margin:100px auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
}

input,button{
width:100%;
padding:8px;
margin:5px 0;
}

#dashboard{display:none;}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

th,td{
border:1px solid #ddd;
padding:6px;
font-size:13px;
}

th{
background:#333;
color:#fff;
}

tfoot td{
font-weight:bold;
background:#eee;
}

.kpi{
display:inline-block;
padding:10px;
margin:5px;
background:#222;
color:#fff;
border-radius:6px;
min-width:120px;
text-align:center;
}
</style>
</head>

<body>

<!-- LOGIN BOX -->
<div id="loginBox">
<h3>Gee Impex Login</h3>
<input id="loginId" placeholder="User ID">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<div id="loginMsg" style="color:red;"></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
<h2>Gee Impex Production Dashboard</h2>

<input id="searchInput" placeholder="Search..." onkeyup="searchTable()">
<button onclick="printTable()">Print</button>
<button onclick="exportExcel()">Export Excel</button>

<div id="kpis"></div>

<table id="dataTable">
<thead></thead>
<tbody></tbody>
<tfoot></tfoot>
</table>
</div>

<script>
// LOGIN
const USER_ID="vijay";
const USER_PASS="0011";

function login(){
if(loginId.value===USER_ID && loginPass.value===USER_PASS){
loginBox.style.display="none";
dashboard.style.display="block";
loadDashboard();
}else{
loginMsg.innerText="Wrong ID or Password!";
}
}

// GOOGLE SHEET CSV
const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let headers=[];

// LOAD DATA
function loadDashboard(){
fetch(sheetURL).then(r=>r.text()).then(data=>{
let rows=data.split("\n").map(r=>r.split(","));
headers=rows[0].map(h=>h.trim());
let bodyRows=rows.slice(1);

// HEADER
let thead="<tr>";
headers.forEach(h=>{
if(["Rate","Amount","Status","Qty Received","Qty Received Date"].includes(h)) return;
thead+="<th>"+h+"</th>";
});
thead+="</tr>";
document.querySelector("thead").innerHTML=thead;

// BODY
let tbody="";
bodyRows.forEach(row=>{
if(row.length<headers.length) return;
tbody+="<tr>";
row.forEach((cell,i)=>{
let h=headers[i];
if(["Rate","Amount","Status","Qty Received","Qty Received Date"].includes(h)) return;
tbody+="<td>"+cell+"</td>";
});
tbody+="</tr>";
});
document.querySelector("tbody").innerHTML=tbody;

updateTotals();
});
}

// TOTALS + KPI
function updateTotals(){
let totals=new Array(headers.length).fill(0);

document.querySelectorAll("tbody tr").forEach(row=>{
if(row.style.display==="none") return;
let cells=row.querySelectorAll("td");
let colIndex=0;

headers.forEach((h,i)=>{
if(["Rate","Amount","Status","Qty Received","Qty Received Date"].includes(h)) return;

let v=parseFloat(cells[colIndex]?.innerText);
if(!isNaN(v)) totals[i]+=v;
colIndex++;
});
});

generateTotals(totals);
generateKPIs(totals);
}

function generateTotals(totals){
let html="<tr>";
let colIndex=0;

headers.forEach((h,i)=>{
if(["Rate","Amount","Status","Qty Received","Qty Received Date"].includes(h)) return;

if(colIndex==0){
html+="<td>Total</td>";
}else{
html+="<td>"+(totals[i]||"")+"</td>";
}
colIndex++;
});
html+="</tr>";
document.querySelector("tfoot").innerHTML=html;
}

function generateKPIs(totals){
let html="";
headers.forEach((h,i)=>{
if(["Rate","Amount","Status","Qty Received","Qty Received Date"].includes(h)) return;

if(totals[i]){
html+=`<div class="kpi">${h}<br>${totals[i]}</div>`;
}
});
kpis.innerHTML=html;
}

// SEARCH
function searchTable(){
let v=searchInput.value.toLowerCase();
document.querySelectorAll("tbody tr").forEach(r=>{
r.style.display=r.innerText.toLowerCase().includes(v)?"":"none";
});
updateTotals();
}

// PRINT TABLE (PROPER FORMAT)
function printTable(){
let table=document.getElementById("dataTable").outerHTML;
let w=window.open("");
w.document.write(`
<html>
<head>
<title>Gee Impex Report</title>
<style>
body { font-family: Arial; padding:20px; }
table { border-collapse: collapse; width:100%; }
th, td { border:1px solid #000; padding:6px; font-size:12px; }
th { background:#f2f2f2; }
tfoot td { font-weight:bold; background:#ddd; }
</style>
</head>
<body>
<h2>Gee Impex Production Report</h2>
${table}
</body>
</html>
`);
w.document.close();
w.print();
}

// EXPORT EXCEL
function exportExcel(){
let table=document.getElementById("dataTable").outerHTML;
let blob=new Blob([table],{type:"application/vnd.ms-excel"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="Gee_Impex_Data.xls";
a.click();
}
</script>

</body>
</html>
