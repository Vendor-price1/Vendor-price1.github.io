<!DOCTYPE html>
<html>
<head>
<title>Gee Impex Production Dashboard</title>

<style>
body{
font-family:"Segoe UI",Arial;
background:#0f172a;
padding:15px;
}

/* TITLE */
h2{
color:white;
text-align:center;
margin-bottom:8px;
}

/* DASHBOARD BOX */
#dashboard{
background:#f8fafc;
padding:12px;
border-radius:12px;
box-shadow:0 8px 25px rgba(0,0,0,.4);
}

/* TOOLBAR */
.toolbar{
margin-bottom:8px;
display:flex;
gap:8px;
align-items:center;
}

input{
padding:6px 10px;
border-radius:6px;
border:1px solid #ccc;
font-size:13px;
}

button{
padding:6px 12px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
font-size:13px;
}
button:hover{background:#1d4ed8}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:8px;
overflow:hidden;
}

/* HEADER */
th{
background:#0f172a;
color:#fff;
padding:8px;
font-size:14px;
border:1px solid #1f2937;
text-align:center;
position:sticky;
top:0;
}

/* DATA */
td{
border:1px solid #d1d5db;
padding:6px;
font-size:13px;
}

/* ALIGN */
.text-left{ text-align:left; font-weight:500; }
.num{ text-align:center; }

/* STRIPE */
tbody tr:nth-child(even){background:#f3f4f6;}
tbody tr:hover{background:#dbeafe;}

/* TOTAL ROW */
tfoot td{
background:#0f172a;
color:#fff;
font-weight:bold;
border:1px solid #1f2937;
font-size:14px;
}

/* FOOTER */
footer{
margin-top:10px;
text-align:center;
color:white;
font-size:12px;
}

/* PAGINATION */
#pagination{
margin-top:8px;
text-align:center;
}
#pagination button{
padding:4px 8px;
margin:2px;
border:none;
background:#374151;
color:white;
border-radius:4px;
cursor:pointer;
}
#pagination button.active{
background:#2563eb;
}

/* PRINT STYLE */
@media print{
body{background:white;}
h2{color:black;}
button,input,#pagination{display:none;}
table,th,td{
border:1px solid black !important;
}
}
</style>
</head>

<body>

<h2>📊 Gee Impex Production Dashboard</h2>

<div id="dashboard">

<!-- TOOLBAR -->
<div class="toolbar">
<input id="searchInput" placeholder="Search data..." onkeyup="searchTable()">
<button onclick="printTable()">Print</button>
<button onclick="exportExcel()">Export Excel</button>
</div>

<table id="dataTable">
<thead></thead>
<tbody></tbody>
<tfoot></tfoot>
</table>

<div id="pagination"></div>

</div>

<footer>Created by: Vijay Pandey</footer>

<script>
// GOOGLE SHEET LINK
const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let headers=[], originalRows=[], allRows=[];
let currentPage=1;
let rowsPerPage=25; // 25 rows per page

// LOAD DATA
fetch(sheetURL).then(r=>r.text()).then(data=>{
let csv=data.split("\n").map(r=>r.split(","));
headers=csv[0];
originalRows=csv.slice(1);
allRows=[...originalRows];
buildTable();
});

// BUILD HEADER
function buildTable(){
let thead="<tr>";
headers.forEach(h=>thead+="<th>"+h+"</th>");
thead+="</tr>";
document.querySelector("thead").innerHTML=thead;
showPage(1);
}

// SHOW PAGE
function showPage(page){
currentPage=page;
let start=(page-1)*rowsPerPage;
let end=start+rowsPerPage;
let pageRows=allRows.slice(start,end);
renderRows(pageRows);
createPagination();
}

// RENDER DATA
function renderRows(rows){
let tbody="";
rows.forEach(r=>{
tbody+="<tr>";
r.forEach((c,i)=>{
let col=headers[i];
let cls="num";
if(col=="Job Card No" || col=="Brand Name" || col=="Vendor Article Number"){
cls="text-left";
}
tbody+=`<td class="${cls}">${c}</td>`;
});
tbody+="</tr>";
});
document.querySelector("tbody").innerHTML=tbody;
calculateTotals(rows);
}

// TOTALS CALCULATION
function calculateTotals(rows){
let totals=new Array(headers.length).fill(0);

rows.forEach(r=>{
r.forEach((c,i)=>{
let v=parseFloat(c);
if(!isNaN(v)) totals[i]+=v;
});
});

let html="<tr>";
headers.forEach((h,i)=>{
if(i==0){
html+="<td class='text-left'>TOTAL</td>";
}
else if(h.trim()=="Qty Received Date"){
html+="<td></td>";
}
else{
html+=`<td class='num'>${totals[i]||""}</td>`;
}
});
html+="</tr>";

document.querySelector("tfoot").innerHTML=html;
}

// PAGINATION BUTTONS
function createPagination(){
let totalPages=Math.ceil(allRows.length/rowsPerPage);
let html="";
for(let i=1;i<=totalPages;i++){
html+=`<button class="${i==currentPage?'active':''}" onclick="showPage(${i})">${i}</button>`;
}
document.getElementById("pagination").innerHTML=html;
}

// SEARCH FIX (WITH PAGINATION)
function searchTable(){
let v=searchInput.value.toLowerCase();
if(v===""){
allRows=[...originalRows];
}else{
allRows=originalRows.filter(r=>r.join(" ").toLowerCase().includes(v));
}
showPage(1);
}

// PRINT
function printTable(){
let w=window.open("");
w.document.write(`
<html>
<head>
<title>Gee Impex Production Report</title>
<style>
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid black;padding:6px;font-size:12px;}
th{background:#eee;}
</style>
</head>
<body>
<h2>Gee Impex Production Report</h2>
${document.getElementById("dataTable").outerHTML}
</body></html>
`);
w.print();
}

// EXPORT EXCEL
function exportExcel(){
let table=document.getElementById("dataTable").outerHTML;
let blob=new Blob([`
<html>
<head>
<style>
table{border-collapse:collapse;}
td,th{border:1px solid black;padding:5px;}
</style>
</head>
<body>${table}</body>
</html>
`],{type:"application/vnd.ms-excel"});

let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="Gee_Impex_Report.xls";
a.click();
}
</script>

</body>
</html>
