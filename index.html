<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Production Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#eef2f7;
}
.header{
  background:#0f172a;
  color:white;
  padding:18px;
  font-size:22px;
  font-weight:600;
  text-align:center;
}
.container{padding:20px;}

.top-bar{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}
input, select{
  padding:6px 10px;
  border-radius:6px;
  border:1px solid #ccc;
}
button{
  padding:7px 14px;
  border:none;
  border-radius:6px;
  background:#111827;
  color:white;
  cursor:pointer;
}
button:hover{background:#000;}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:15px;
  margin-bottom:25px;
}
.card{
  padding:20px;
  border-radius:14px;
  color:white;
  box-shadow:0 6px 18px rgba(0,0,0,0.15);
}
.card h4{margin:0;font-size:13px;}
.card h2{margin:8px 0 0;font-size:24px;font-weight:700;}

.blue{background:linear-gradient(135deg,#2563eb,#1e3a8a);}
.green{background:linear-gradient(135deg,#16a34a,#065f46);}
.orange{background:linear-gradient(135deg,#f97316,#c2410c);}
.red{background:linear-gradient(135deg,#dc2626,#7f1d1d);}
.purple{background:linear-gradient(135deg,#7c3aed,#4c1d95);}
.dark{background:linear-gradient(135deg,#111827,#000);}

.table-container{
  background:white;
  border-radius:12px;
  overflow:auto;
  box-shadow:0 6px 18px rgba(0,0,0,0.1);
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th{
  background:#0f172a;
  color:white;
  padding:8px;
  position:sticky;
  top:0;
}
td{
  padding:8px;
  text-align:center;
  border-bottom:1px solid #eee;
}
tr:nth-child(even){background:#f9fafb;}

@media print{
  .top-bar{display:none;}
  body{background:white;}
}
</style>
</head>

<body>

<div class="header">Production Dashboard</div>

<div class="container">

<div class="top-bar">
  <div>
    <input type="text" id="searchInput" placeholder="Search...">
    <select id="brandFilter">
      <option value="">All Brands</option>
    </select>
  </div>
  <button onclick="window.print()">Print</button>
</div>

<div class="cards">
  <div class="card blue"><h4>PO Qty</h4><h2 id="poQty">0</h2></div>
  <div class="card green"><h4>Cut Qty</h4><h2 id="cutQty">0</h2></div>
  <div class="card purple"><h4>Finished Qty</h4><h2 id="finQty">0</h2></div>
  <div class="card orange"><h4>Packed</h4><h2 id="packedQty">0</h2></div>
  <div class="card red"><h4>Rejection</h4><h2 id="rejQty">0</h2></div>
  <div class="card dark"><h4>Total Amount</h4><h2 id="totalAmount">0</h2></div>
</div>

<div class="table-container">
<table id="dataTable">
<thead>
<tr>
<th>Job Card No</th>
<th>Brand Name</th>
<th>Vendor Article Number</th>
<th>Po Qty</th>
<th>Cut Qty</th>
<th>Finished Qty</th>
<th>Packed</th>
<th>Rejection</th>
<th>Amount</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?output=csv";

let fullData=[];

Papa.parse(sheetURL,{
 download:true,
 header:true,
 complete:function(results){
   fullData=results.data.filter(r=>r["Job Card No"]);
   populateBrandFilter();
   renderTable(fullData);
 }
});

function populateBrandFilter(){
 let brands=[...new Set(fullData.map(r=>r["Brand Name"]))];
 let select=document.getElementById("brandFilter");
 brands.forEach(b=>{
   let opt=document.createElement("option");
   opt.value=b;
   opt.text=b;
   select.appendChild(opt);
 });
}

function renderTable(data){

 let tbody=document.querySelector("#dataTable tbody");
 tbody.innerHTML="";

 let totals={po:0,cut:0,fin:0,packed:0,rej:0,amount:0};

 data.forEach(row=>{
   let tr=`<tr>
   <td>${row["Job Card No"]}</td>
   <td>${row["Brand Name"]}</td>
   <td>${row["Vendor Article Number"]}</td>
   <td>${row["Po Qty"]}</td>
   <td>${row["Cut Qty"]}</td>
   <td>${row["Finished Qty"]}</td>
   <td>${row["Packed"]}</td>
   <td>${row["Rejection"]}</td>
   <td>${row["Amount"]}</td>
   </tr>`;
   tbody.innerHTML+=tr;

   totals.po+=Number(row["Po Qty"])||0;
   totals.cut+=Number(row["Cut Qty"])||0;
   totals.fin+=Number(row["Finished Qty"])||0;
   totals.packed+=Number(row["Packed"])||0;
   totals.rej+=Number(row["Rejection"])||0;
   totals.amount+=Number(row["Amount"])||0;
 });

 document.getElementById("poQty").innerText=totals.po;
 document.getElementById("cutQty").innerText=totals.cut;
 document.getElementById("finQty").innerText=totals.fin;
 document.getElementById("packedQty").innerText=totals.packed;
 document.getElementById("rejQty").innerText=totals.rej;
 document.getElementById("totalAmount").innerText=totals.amount;
}

function applyFilters(){

 let search=document.getElementById("searchInput").value.toLowerCase();
 let brand=document.getElementById("brandFilter").value;

 let filtered=fullData.filter(row=>{
   let matchSearch=Object.values(row).join(" ").toLowerCase().includes(search);
   let matchBrand=brand?row["Brand Name"]===brand:true;
   return matchSearch && matchBrand;
 });

 renderTable(filtered);
}

document.getElementById("searchInput").addEventListener("keyup",applyFilters);
document.getElementById("brandFilter").addEventListener("change",applyFilters);

</script>

</body>
</html>
