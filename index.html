<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gee Impex Live Production Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Segoe UI;
background:#eef2f7;
-webkit-print-color-adjust: exact;
print-color-adjust: exact;
}

/* HEADER */
.header{
background:#000;
color:white;
padding:12px;
text-align:center;
position:relative;
}

.title{
font-size:22px;
font-weight:600;
}

.clock{
position:absolute;
right:20px;
top:15px;
font-size:14px;
}

/* CONTAINER */
.container{
padding:15px;
}

/* BUTTON BAR */
.top-bar{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
gap:10px;
margin-bottom:15px;
}

button{
padding:6px 12px;
border:none;
border-radius:6px;
background:#111827;
color:white;
cursor:pointer;
}

/* CARDS */
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;
margin-bottom:20px;
}

.card{
padding:12px;
border-radius:10px;
color:white;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
text-align:center;
}

.card h4{margin:0;font-size:11px;}
.card h2{margin:5px 0 0;font-size:16px;font-weight:700;}

.blue{background:#2563eb;}
.green{background:#16a34a;}
.orange{background:#f97316;}
.red{background:#dc2626;}
.purple{background:#7c3aed;}
.dark{background:#111827;}

/* TABLE */
.table-container{
background:white;
border-radius:10px;
overflow:auto;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
position:relative;
}

table{
width:100%;
border-collapse:collapse;
font-size:11px;
min-width:900px;
}

th{
background:#000;
color:white;
padding:8px;
text-align:center;
position:sticky;
top:0;
cursor:pointer;
}

td{
padding:6px;
text-align:center;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f9fafb;
}

/* FILTER DROPDOWN */
.filter-box{
position:absolute;
background:white;
border:1px solid #ccc;
max-height:200px;
overflow:auto;
z-index:1000;
padding:8px;
display:none;
font-size:12px;
}

.filter-box label{
display:block;
}

/* FOOTER */
.footer{
background:#000;
color:white;
text-align:center;
padding:10px;
margin-top:20px;
font-size:13px;
}

/* PRINT */
@media print{
.top-bar,.clock,.filter-box,button{display:none;}
}
</style>
</head>

<body>

<div class="header">
<div class="title">Gee Impex Live Production Dashboard</div>
<div class="clock" id="clock"></div>
</div>

<div class="container">

<div class="top-bar">
<div>
<button onclick="exportToExcel()">Export Excel</button>
<button onclick="window.print()">Print</button>
</div>
</div>

<div class="cards" id="cardsContainer"></div>

<div class="table-container">
<table id="dataTable">
<thead><tr id="headerRow"></tr></thead>
<tbody></tbody>
</table>
<div id="filterBox" class="filter-box"></div>
</div>

</div>

<div class="footer">
Created by: Vijay Pandey
</div>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let fullData=[];
let headers=[];
let activeFilters={};
let filteredData=[];

/* CLOCK */
function updateClock(){
let now=new Date();
document.getElementById("clock").innerText=
now.toLocaleDateString()+" "+now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

/* LOAD DATA */
function loadData(){
Papa.parse(sheetURL,{
download:true,
header:true,
skipEmptyLines:true,
complete:function(results){
fullData=results.data.filter(row=>{
return Object.values(row).some(v=>v && v.trim()!=="");
});
headers=Object.keys(fullData[0]);
createHeaders();
createCards();
applyFilters();
}
});
}
loadData();
setInterval(loadData,60000);

/* HEADERS WITH FILTER */
function createHeaders(){
let headerRow=document.getElementById("headerRow");
headerRow.innerHTML="";

headers.forEach(h=>{
let th=document.createElement("th");
th.innerHTML=h+" ⏷";
th.onclick=(e)=>openFilter(e,h);
headerRow.appendChild(th);
});
}

function openFilter(event,column){

let filterBox=document.getElementById("filterBox");
filterBox.innerHTML="";

let values=[...new Set(fullData.map(r=>r[column]))];

values.forEach(val=>{
let label=document.createElement("label");
let checked=activeFilters[column]?.includes(val)?"checked":"";
label.innerHTML=`<input type="checkbox" value="${val}" ${checked}> ${val}`;
filterBox.appendChild(label);
});

let btn=document.createElement("button");
btn.innerText="Apply";
btn.style.marginTop="5px";
btn.onclick=function(){
let checked=[...filterBox.querySelectorAll("input:checked")].map(i=>i.value);
activeFilters[column]=checked;
filterBox.style.display="none";
applyFilters();
};
filterBox.appendChild(btn);

filterBox.style.display="block";
filterBox.style.left=event.pageX+"px";
filterBox.style.top=event.pageY+"px";
}

/* APPLY FILTERS */
function applyFilters(){

let data=fullData.filter(row=>{
return Object.keys(activeFilters).every(col=>{
if(!activeFilters[col]||activeFilters[col].length===0) return true;
return activeFilters[col].includes(row[col]);
});
});

renderTable(data);
}

/* TABLE + TOTALS */
function renderTable(data){

filteredData=data;

let tbody=document.querySelector("#dataTable tbody");
tbody.innerHTML="";
let totals={};

data.forEach(row=>{
let tr="<tr>";
headers.forEach(h=>{
let val=row[h]||"";
tr+=`<td>${val}</td>`;
let num=parseFloat(val);
if(!isNaN(num)){ totals[h]=(totals[h]||0)+num; }
});
tr+="</tr>";
tbody.innerHTML+=tr;
});

Object.keys(totals).forEach(key=>{
let el=document.getElementById(key.replace(/\s/g,''));
if(el){ el.innerText=totals[key]; }
});
}

/* KPI CARDS */
function createCards(){
let kpi=["Po Qty","Cut Qty","Line Qty","Finished Qty","Packed","Rejection","Amount"];
let colors=["blue","green","purple","orange","red","dark","blue"];

let container=document.getElementById("cardsContainer");
container.innerHTML="";

kpi.forEach((col,i)=>{
let div=document.createElement("div");
div.className="card "+colors[i];
div.innerHTML=`<h4>${col}</h4><h2 id="${col.replace(/\s/g,'')}">0</h2>`;
container.appendChild(div);
});
}

/* EXPORT */
function exportToExcel(){
let ws=XLSX.utils.json_to_sheet(filteredData);
let wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Dashboard");
XLSX.writeFile(wb,"Gee_Impex_Dashboard.xlsx");
}

</script>

</body>
</html>
