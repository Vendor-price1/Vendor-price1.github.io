<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gee Impex Live Production Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<!-- DataTables -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<!-- Buttons -->
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
<script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<!-- CSV -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#f4f6f9;
}

.header{
background:#000;
color:#fff;
padding:15px;
text-align:center;
font-size:22px;
font-weight:600;
}

.container{
padding:15px;
}

/* ✅ FIXED GRID TABLE */
table.dataTable{
width:100% !important;
border-collapse:collapse !important;
table-layout:fixed !important;
}

table.dataTable th,
table.dataTable td{
border:1px solid #dcdcdc;
padding:8px;
text-align:center;
vertical-align:middle;
overflow:hidden;
text-overflow:ellipsis;
}

table.dataTable thead th{
background:#000;
color:#fff;
}

table.dataTable tbody tr:nth-child(even){
background:#f9f9f9;
}

table.dataTable tbody tr:hover{
background:#eef6ff;
}

.text-right{
text-align:right !important;
}

/* FILTER BELOW HEADER TEXT */
.header-title{
display:block;
}

.filter-container{
margin-top:4px;
}

.filter-icon{
cursor:pointer;
color:#ffc107;
font-size:12px;
}

.top-controls{
margin-bottom:15px;
}

button{
padding:6px 12px;
background:#111827;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
}

.footer{
background:#000;
color:#fff;
text-align:center;
padding:10px;
margin-top:20px;
font-size:13px;
}
</style>
</head>

<body>

<div class="header">
Gee Impex Live Production Dashboard
</div>

<div class="container">

<div class="top-controls">
<button onclick="resetFilters()">Reset Filters</button>
</div>

<table id="dataTable" class="display"></table>

</div>

<div class="footer">
Created by: Vijay Pandey
</div>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let table;

function loadData(){

Papa.parse(sheetURL,{
download:true,
header:true,
skipEmptyLines:true,
complete:function(results){

let data=results.data.filter(r=>Object.values(r).some(v=>v));
if(data.length===0) return;

let headers=Object.keys(data[0]);

if(table){
table.destroy();
$('#dataTable').empty();
}

table=$('#dataTable').DataTable({
data:data,
scrollX:true,
autoWidth:false,
ordering:false,
columns:headers.map(h=>({
title:`<span class="header-title">${h}</span>
        <div class="filter-container">
        <span class="filter-icon">🔽</span>
        </div>`,
data:h
}))
});

addFilters();

}
});

}

loadData();
setInterval(loadData,60000);

/* FILTER FUNCTION */
function addFilters(){

$('#dataTable thead th').each(function(index){

let column=table.column(index);
let header=$(this);

header.find('.filter-icon').off('click').on('click',function(e){

e.stopPropagation();
$('select.column-filter').remove();

let select=$('<select multiple class="column-filter" style="width:100%;margin-top:5px;"></select>')
.appendTo(header.find('.filter-container'))
.on('change',function(){

let vals=$(this).val();
let search=vals ? vals.join('|') : '';
column.search(search,true,false).draw();
});

column.data().unique().sort().each(function(d){
select.append('<option value="'+d+'">'+d+'</option>');
});

});

});

}

/* RESET */
function resetFilters(){
table.search('').columns().search('').draw();
$('select.column-filter').remove();
}

</script>

</body>
</html>
