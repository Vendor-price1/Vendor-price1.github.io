<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gee Impex Live Production Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Segoe UI;background:#eef2f7;}

.header{
background:#000;
color:white;
padding:12px;
text-align:center;
position:relative;
}

.title{font-size:22px;font-weight:600;}

.clock{
position:absolute;
right:20px;
top:15px;
font-size:14px;
}

.container{padding:15px;}

.top-bar{
display:flex;
justify-content:flex-end;
gap:10px;
margin-bottom:15px;
flex-wrap:wrap;
}

button{
padding:6px 12px;
border:none;
border-radius:6px;
background:#111827;
color:white;
cursor:pointer;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;
margin-bottom:20px;
}

.card{
padding:15px;
border-radius:10px;
color:white;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.card h4{margin:0;font-size:12px;}
.card h2{margin:6px 0 0;font-size:18px;font-weight:700;}

.color0{background:#2563eb;}
.color1{background:#16a34a;}
.color2{background:#f97316;}
.color3{background:#dc2626;}
.color4{background:#7c3aed;}
.color5{background:#111827;}

.table-container{
background:white;
border-radius:10px;
overflow:auto;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
position:relative;
}

table{
width:100%;
border-collapse:collapse;
font-size:11px;
min-width:1000px;
}

th{
background:#000;
color:white;
padding:8px;
text-align:center;
position:sticky;
top:0;
cursor:pointer;
}

td{
padding:6px;
text-align:center;
border-bottom:1px solid #eee;
}

tr:nth-child(even){background:#f9fafb;}

.filter-box{
position:absolute;
background:white;
border:1px solid #ccc;
padding:10px;
max-height:250px;
overflow:auto;
z-index:999;
display:none;
font-size:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.filter-box label{display:block;}

.footer{
background:#000;
color:white;
text-align:center;
padding:10px;
margin-top:20px;
font-size:13px;
}

@media print{
.top-bar,.clock,.filter-box,button{display:none;}
}
</style>
</head>

<body>

<div class="header">
<div class="title">Gee Impex Live Production Dashboard</div>
<div class="clock" id="clock"></div>
</div>

<div class="container">

<div class="top-bar">
<button onclick="exportToExcel()">Export Excel</button>
<button onclick="resetFilters()">Reset Filter</button>
<button onclick="window.print()">Print</button>
</div>

<div class="cards" id="cardsContainer"></div>

<div class="table-container">
<table id="dataTable">
<thead><tr id="headerRow"></tr></thead>
<tbody></tbody>
</table>
<div id="filterBox" class="filter-box"></div>
</div>

</div>

<div class="footer">
Created by: Vijay Pandey
</div>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let fullData=[];
let filteredData=[];
let headers=[];
let numericColumns=[];
let filters={};

/* CLOCK */
function updateClock(){
let now=new Date();
document.getElementById("clock").innerText=
now.toLocaleDateString()+" "+now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

/* LOAD DATA */
function loadData(){
Papa.parse(sheetURL,{
download:true,
header:true,
skipEmptyLines:true,
complete:function(res){

fullData=res.data.filter(r=>Object.values(r).some(v=>v));
headers=Object.keys(fullData[0]);

detectNumeric();
createHeaders();
createCards();
applyFilters();
}
});
}
loadData();
setInterval(loadData,60000);

/* DETECT NUMERIC */
function detectNumeric(){
numericColumns=headers.filter(h=>{
return fullData.some(r=>!isNaN(parseFloat(r[h])));
});
}

/* CREATE HEADERS */
function createHeaders(){
let row=document.getElementById("headerRow");
row.innerHTML="";
headers.forEach(h=>{
let th=document.createElement("th");
th.innerHTML=h+" ⏷";
th.onclick=(e)=>showFilter(e,h);
row.appendChild(th);
});
}

/* SHOW FILTER */
function showFilter(e,column){

let box=document.getElementById("filterBox");
box.innerHTML="";

let values=[...new Set(fullData.map(r=>String(r[column]||"").trim()))];
values.sort();

values.forEach(v=>{
let label=document.createElement("label");
label.innerHTML=`<input type="checkbox" value="${v}"> ${v}`;
box.appendChild(label);
});

let btn=document.createElement("button");
btn.innerText="Apply";
btn.style.marginTop="5px";
btn.onclick=function(){

let selected=[...box.querySelectorAll("input:checked")]
.map(i=>i.value);

if(selected.length===0){
delete filters[column];
}else{
filters[column]=selected;
}

box.style.display="none";
applyFilters();
};

box.appendChild(btn);

box.style.display="block";
box.style.left=e.pageX+"px";
box.style.top=e.pageY+"px";
}

/* APPLY FILTERS */
function applyFilters(){

filteredData=fullData.filter(row=>{
for(let col in filters){
let cell=String(row[col]||"").trim();
if(!filters[col].includes(cell)){
return false;
}
}
return true;
});

renderTable();
updateCards();
}

/* RESET */
function resetFilters(){
filters={};
applyFilters();
}

/* TABLE */
function renderTable(){
let tbody=document.querySelector("#dataTable tbody");
tbody.innerHTML="";

filteredData.forEach(r=>{
let tr="<tr>";
headers.forEach(h=>{
tr+=`<td>${r[h]||""}</td>`;
});
tr+="</tr>";
tbody.innerHTML+=tr;
});
}

/* CARDS */
function createCards(){
let container=document.getElementById("cardsContainer");
container.innerHTML="";

numericColumns.forEach((col,i)=>{
let div=document.createElement("div");
div.className="card color"+(i%6);
div.innerHTML=`<h4>${col}</h4><h2 id="kpi_${i}">0</h2>`;
container.appendChild(div);
});
}

function updateCards(){
numericColumns.forEach((col,i)=>{
let total=0;
filteredData.forEach(r=>{
let num=parseFloat(r[col]);
if(!isNaN(num)) total+=num;
});
document.getElementById("kpi_"+i).innerText=total;
});
}

/* EXPORT */
function exportToExcel(){
let ws=XLSX.utils.json_to_sheet(filteredData);
let wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Dashboard");
XLSX.writeFile(wb,"Gee_Impex_Dashboard.xlsx");
}

</script>

</body>
</html>
