<!DOCTYPE html>
<html>
<head>
<title>Gee Impex Production Dashboard</title>

<style>
body{
font-family: "Segoe UI", Arial;
background: linear-gradient(135deg,#0f172a,#1e293b);
padding:20px;
}

/* LOGIN BOX */
#loginBox{
width:320px;
margin:120px auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

/* INPUTS */
input,button{
padding:9px;
margin:5px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

/* BUTTONS */
button{
background:#2563eb;
color:#fff;
border:none;
font-weight:bold;
cursor:pointer;
padding:8px 12px;
}
button:hover{background:#1d4ed8}

/* DASHBOARD */
#dashboard{
display:none;
background:#f8fafc;
padding:15px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,.25);
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:8px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

/* HEADER */
th{
background:#111827;
color:#fff;
padding:8px;
font-size:13px;
border:1px solid #374151;
position:sticky;
top:0;
}

/* DATA CELLS */
td{
border:1px solid #e5e7eb;
padding:6px;
font-size:12px;
}

/* STRIPED ROWS */
tbody tr:nth-child(even){
background:#f3f4f6;
}
tbody tr:hover{
background:#dbeafe;
}

/* TOTAL ROW STYLE (LIKE HEADER) */
tfoot td{
background:#111827;
color:#fff;
font-weight:bold;
border:1px solid #374151;
}

/* KPI */
.kpi{
display:inline-block;
padding:10px 15px;
margin:6px;
background:linear-gradient(135deg,#2563eb,#9333ea);
color:#fff;
border-radius:8px;
font-weight:bold;
}

/* PAGINATION */
#pagination button{
margin:2px;
padding:5px 10px;
background:#374151;
color:#fff;
border-radius:5px;
border:none;
}
#pagination button.active{
background:#2563eb;
}

/* FOOTER */
footer{
text-align:center;
margin-top:10px;
font-size:12px;
color:#fff;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
<h3>Secure Login</h3>
<input id="loginId" placeholder="User ID"><br>
<input id="loginPass" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>
<div id="loginMsg" style="color:red"></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

<h2 style="text-align:center;margin:5px 0;">📊 Gee Impex Production Dashboard</h2>

<input id="searchInput" placeholder="Search..." onkeyup="searchTable()">

<button onclick="printTable()">Print</button>
<button onclick="exportExcel()">Excel</button>

<div id="kpis"></div>

<table id="dataTable">
<thead></thead>
<tbody></tbody>
<tfoot></tfoot>
</table>

<div id="pagination"></div>

</div>

<footer>Created by: Vijay Pandey</footer>

<script>
// ================= LOGIN SYSTEM =================
const USER_ID="vijay";
const USER_PASS="0011";

if(sessionStorage.getItem("loggedIn")){
loginBox.style.display="none";
dashboard.style.display="block";
loadDashboard();
}

function login(){
if(loginId.value===USER_ID && loginPass.value===USER_PASS){
sessionStorage.setItem("loggedIn","true");
loginBox.style.display="none";
dashboard.style.display="block";
loadDashboard();
}else{
loginMsg.innerText="Wrong ID or Password!";
}
}

// ================= GOOGLE SHEET =================
const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let headers=[];
let allRows=[];
let originalRows=[];
let currentPage=1;
let rowsPerPage=25;

// LOAD DATA
function loadDashboard(){
fetch(sheetURL).then(r=>r.text()).then(data=>{
let rows=data.split("\n").map(r=>r.split(","));
headers=rows[0].map(h=>h.trim());
originalRows=rows.slice(1);
allRows=[...originalRows];
buildTable();
});
}

// BUILD HEADER
function buildTable(){
let thead="<tr>";
headers.forEach(h=>{
if(["Rate","Amount","Status","Qty Received","Qty Received Date"].includes(h)) return;
thead+="<th>"+h+"</th>";
});
thead+="</tr>";
document.querySelector("thead").innerHTML=thead;
showPage(1);
}

// PAGINATION
function showPage(page){
currentPage=page;
let start=(page-1)*rowsPerPage;
let pageRows=allRows.slice(start,start+rowsPerPage);

let tbody="";
pageRows.forEach(row=>{
tbody+="<tr>";
row.forEach((cell,i)=>{
let h=headers[i];
if(["Rate","Amount","Status","Qty Received","Qty Received Date"].includes(h)) return;
tbody+="<td>"+cell+"</td>";
});
tbody+="</tr>";
});
document.querySelector("tbody").innerHTML=tbody;

updateTotals();
createPagination();
}

function createPagination(){
let totalPages=Math.ceil(allRows.length/rowsPerPage);
let html="";
for(let i=1;i<=totalPages;i++){
html+=`<button class="${i==currentPage?'active':''}" onclick="showPage(${i})">${i}</button>`;
}
pagination.innerHTML=html;
}

// TOTALS + KPI
function updateTotals(){
let totals=new Array(headers.length).fill(0);

document.querySelectorAll("tbody tr").forEach(row=>{
let cells=row.querySelectorAll("td");
let colIndex=0;

headers.forEach((h,i)=>{
if(["Rate","Amount","Status","Qty Received","Qty Received Date"].includes(h)) return;
let v=parseFloat(cells[colIndex]?.innerText);
if(!isNaN(v)) totals[i]+=v;
colIndex++;
});
});

generateTotals(totals);
generateKPIs(totals);
}

function generateTotals(totals){
let html="<tr>";
let colIndex=0;

headers.forEach((h,i)=>{
if(["Rate","Amount","Status","Qty Received","Qty Received Date"].includes(h)) return;

if(colIndex==0){
html+="<td><b>TOTAL</b></td>";
}else{
html+="<td><b>"+(totals[i]||"")+"</b></td>";
}
colIndex++;
});
html+="</tr>";
document.querySelector("tfoot").innerHTML=html;
}

function generateKPIs(totals){
let html="";
headers.forEach((h,i)=>{
if(["Rate","Amount","Status","Qty Received","Qty Received Date"].includes(h)) return;
if(totals[i]) html+=`<div class="kpi">${h}<br>${totals[i]}</div>`;
});
kpis.innerHTML=html;
}

// SEARCH FIX
function searchTable(){
let v=searchInput.value.toLowerCase();
if(v===""){
allRows=[...originalRows];
}else{
allRows=originalRows.filter(r=>r.join(" ").toLowerCase().includes(v));
}
showPage(1);
}

// PRINT
function printTable(){
let w=window.open("");
w.document.write(`
<style>
table{border-collapse:collapse;width:100%;}
th,td{border:1px solid #000;padding:5px;font-size:12px;}
th{background:#ddd;}
tfoot td{font-weight:bold;background:#ccc;}
</style>
<h2>Gee Impex Production Report</h2>
${dataTable.outerHTML}
`);
w.print();
}

// EXPORT EXCEL
function exportExcel(){
let table=dataTable.outerHTML;
let blob=new Blob([table],{type:"application/vnd.ms-excel"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="Gee_Impex_Data.xls";
a.click();
}
</script>

</body>
</html>
