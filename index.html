<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gee Impex Salary Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#f4f6f9;
}

.header{
background:#000;
color:#fff;
padding:15px;
text-align:center;
font-size:22px;
font-weight:600;
}

.container{
padding:15px;
}

.top-controls{
margin-bottom:15px;
display:flex;
gap:10px;
flex-wrap:wrap;
align-items:center;
}

button{
padding:6px 12px;
background:#111827;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
}

input[type="text"]{
padding:6px;
border:1px solid #ccc;
border-radius:6px;
}

.total-box{
background:#16a34a;
color:#fff;
padding:8px 15px;
border-radius:6px;
font-weight:bold;
}

table{
border-collapse:collapse;
width:100%;
background:#fff;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

th{
background:#000;
color:#fff;
}

tr:nth-child(even){
background:#f9f9f9;
}

.remark{
color:#dc2626;
font-weight:bold;
}

@media print{
button,input{
display:none;
}
}
</style>
</head>

<body>

<div class="header">
Gee Impex Salary Dashboard
</div>

<div class="container">

<div class="top-controls">
<input type="text" id="searchInput" placeholder="Search...">
<button onclick="resetSelection()">Reset Selection</button>
<button onclick="exportSelected()">Export Selected</button>
<button onclick="printSelected()">Print Selected</button>
<div class="total-box">
Total Selected Amount: ₹ <span id="totalAmount">0</span>
</div>
</div>

<table id="dataTable"></table>

</div>

<script>

const sheetURL="PASTE_YOUR_GOOGLE_SHEET_CSV_LINK_HERE";

let originalData=[];
let filteredData=[];
let headers=[];
let selectedRows=new Set();

function loadData(){
Papa.parse(sheetURL,{
download:true,
header:true,
skipEmptyLines:true,
complete:function(results){

originalData=results.data.filter(r=>Object.values(r).some(v=>v));
filteredData=[...originalData];
headers=Object.keys(originalData[0]);

renderTable();
}
});
}

loadData();

/* TABLE RENDER */
function renderTable(){

let table=document.getElementById("dataTable");
table.innerHTML="";

let thead="<tr><th>Select</th>";
headers.forEach(h=>{
thead+=`<th>${h}</th>`;
});
thead+="<th>Remark</th></tr>";
table.innerHTML=thead;

filteredData.forEach((row,index)=>{
let tr="<tr>";

let checked=selectedRows.has(index) ? "checked" : "";

tr+=`<td><input type="checkbox" ${checked} onchange="toggleSelect(${index})"></td>`;

headers.forEach(h=>{
tr+=`<td>${row[h] ?? ""}</td>`;
});

let remark=selectedRows.has(index) ? "Salary Done" : "";

tr+=`<td class="remark">${remark}</td>`;
tr+="</tr>";

table.innerHTML+=tr;
});

updateTotal();
}

/* SELECT */
function toggleSelect(index){

if(selectedRows.has(index)){
selectedRows.delete(index);
}else{
selectedRows.add(index);
}

renderTable();
}

/* TOTAL */
function updateTotal(){

let total=0;

selectedRows.forEach(i=>{
let row=filteredData[i];
let amountColumn=headers.find(h=>h.toLowerCase().includes("amount") || h.toLowerCase().includes("salary"));
if(amountColumn){
let val=parseFloat(row[amountColumn]);
if(!isNaN(val)) total+=val;
}
});

document.getElementById("totalAmount").innerText=total;
}

/* RESET */
function resetSelection(){
selectedRows.clear();
renderTable();
}

/* SEARCH */
document.getElementById("searchInput").addEventListener("input",function(){
let val=this.value.toLowerCase();
filteredData=originalData.filter(row=>{
return headers.some(h=>String(row[h] ?? "").toLowerCase().includes(val));
});
selectedRows.clear();
renderTable();
});

/* EXPORT */
function exportSelected(){

let amountColumn=headers.find(h=>h.toLowerCase().includes("amount") || h.toLowerCase().includes("salary"));

let csv="Select,"+headers.join(",")+",Remark\n";

selectedRows.forEach(i=>{
let row=filteredData[i];
csv+="Yes,";
csv+=headers.map(h=>`"${row[h] ?? ""}"`).join(",");
csv+=',"Salary Done"\n';
});

let blob=new Blob([csv],{type:"text/csv"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="Salary_Selected.csv";
a.click();
}

/* PRINT */
function printSelected(){

let printWindow=window.open("","","width=900,height=700");

let html="<h2>Salary Report</h2>";
html+="<table border='1' cellpadding='5' cellspacing='0'>";
html+="<tr>";

headers.forEach(h=>html+=`<th>${h}</th>`);
html+="<th>Remark</th></tr>";

selectedRows.forEach(i=>{
let row=filteredData[i];
html+="<tr>";
headers.forEach(h=>html+=`<td>${row[h] ?? ""}</td>`);
html+="<td>Salary Done</td></tr>";
});

html+="</table>";

printWindow.document.write(html);
printWindow.document.close();
printWindow.print();
}

</script>

</body>
</html>
