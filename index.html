<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gee Impex Live Production Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Segoe UI;
background:#eef2f7;
}

/* HEADER */
.header{
background:#000;
color:white;
padding:12px;
text-align:center;
position:relative;
}

.title{
font-size:22px;
font-weight:600;
}

.clock{
position:absolute;
right:20px;
top:15px;
font-size:14px;
}

/* CONTAINER */
.container{ padding:15px; }

/* BUTTON BAR */
.top-bar{
display:flex;
justify-content:flex-end;
gap:10px;
margin-bottom:15px;
}

button{
padding:6px 12px;
border:none;
border-radius:6px;
background:#111827;
color:white;
cursor:pointer;
}

/* CARDS */
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;
margin-bottom:20px;
}

.card{
padding:15px;
border-radius:10px;
color:white;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.card h4{margin:0;font-size:12px;}
.card h2{margin:6px 0 0;font-size:18px;font-weight:700;}

.colors-0{background:#2563eb;}
.colors-1{background:#16a34a;}
.colors-2{background:#f97316;}
.colors-3{background:#dc2626;}
.colors-4{background:#7c3aed;}
.colors-5{background:#111827;}

/* TABLE */
.table-container{
background:white;
border-radius:10px;
overflow:auto;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
position:relative;
}

table{
width:100%;
border-collapse:collapse;
font-size:11px;
min-width:1000px;
}

th{
background:#000;
color:white;
padding:8px;
text-align:center;
position:sticky;
top:0;
cursor:pointer;
}

td{
padding:6px;
text-align:center;
border-bottom:1px solid #eee;
}

tr:nth-child(even){ background:#f9fafb; }

/* FILTER BOX */
.filter-box{
position:absolute;
background:white;
border:1px solid #ccc;
padding:10px;
max-height:250px;
overflow:auto;
z-index:999;
display:none;
font-size:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.filter-box label{ display:block; }

/* FOOTER */
.footer{
background:#000;
color:white;
text-align:center;
padding:10px;
margin-top:20px;
font-size:13px;
}

/* PRINT */
@media print{
.top-bar,.clock,.filter-box,button{display:none;}
}
</style>
</head>

<body>

<div class="header">
<div class="title">Gee Impex Live Production Dashboard</div>
<div class="clock" id="clock"></div>
</div>

<div class="container">

<div class="top-bar">
<button onclick="exportToExcel()">Export Excel</button>
<button onclick="resetFilters()">Reset Filter</button>
<button onclick="window.print()">Print</button>
</div>

<div class="cards" id="cardsContainer"></div>

<div class="table-container">
<table id="dataTable">
<thead><tr id="headerRow"></tr></thead>
<tbody></tbody>
</table>
<div id="filterBox" class="filter-box"></div>
</div>

</div>

<div class="footer">
Created by: Vijay Pandey
</div>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let fullData=[];
let headers=[];
let activeFilters={};
let numericColumns=[];
let filteredData=[];

/* CLOCK */
function updateClock(){
let now=new Date();
document.getElementById("clock").innerText=
now.toLocaleDateString()+" "+now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

/* LOAD DATA */
function loadData(){
Papa.parse(sheetURL,{
download:true,
header:true,
skipEmptyLines:true,
complete:function(results){

fullData=results.data.filter(row=>
Object.values(row).some(v=>v && v.trim()!=="")
);

if(fullData.length===0) return;

headers=Object.keys(fullData[0]);

detectNumericColumns();
createHeaders();
createCards();
applyFilters();
}
});
}
loadData();
setInterval(loadData,60000);

/* DETECT NUMERIC COLUMNS */
function detectNumericColumns(){
numericColumns=headers.filter(h=>{
return fullData.some(row=>{
let val=parseFloat(row[h]);
return !isNaN(val);
});
});
}

/* CREATE HEADERS */
function createHeaders(){
let headerRow=document.getElementById("headerRow");
headerRow.innerHTML="";
headers.forEach(h=>{
let th=document.createElement("th");
th.innerHTML=h+" ⏷";
th.onclick=(e)=>openFilter(e,h);
headerRow.appendChild(th);
});
}

/* OPEN FILTER */
function openFilter(event,column){

let box=document.getElementById("filterBox");
box.innerHTML="";

let values=[...new Set(fullData.map(r=>r[column]||""))];

values.forEach(val=>{
let label=document.createElement("label");
label.innerHTML=`<input type="checkbox" value="${val}"> ${val}`;
box.appendChild(label);
});

let btn=document.createElement("button");
btn.innerText="Apply";
btn.style.marginTop="5px";
btn.onclick=function(){
let selected=[...box.querySelectorAll("input:checked")]
.map(i=>i.value);
activeFilters[column]=selected;
box.style.display="none";
applyFilters();
};
box.appendChild(btn);

box.style.display="block";
box.style.left=event.pageX+"px";
box.style.top=event.pageY+"px";
}

/* APPLY FILTER */
function applyFilters(){

filteredData=fullData.filter(row=>{
return Object.keys(activeFilters).every(col=>{
if(!activeFilters[col] || activeFilters[col].length===0) return true;
return activeFilters[col].includes(row[col]||"");
});
});

renderTable();
updateCards();
}

/* RESET */
function resetFilters(){
activeFilters={};
applyFilters();
}

/* RENDER TABLE */
function renderTable(){
let tbody=document.querySelector("#dataTable tbody");
tbody.innerHTML="";

filteredData.forEach(row=>{
let tr="<tr>";
headers.forEach(h=>{
tr+=`<td>${row[h]||""}</td>`;
});
tr+="</tr>";
tbody.innerHTML+=tr;
});
}

/* CREATE KPI CARDS */
function createCards(){
let container=document.getElementById("cardsContainer");
container.innerHTML="";

numericColumns.forEach((col,i)=>{
let div=document.createElement("div");
div.className="card colors-"+(i%6);
div.innerHTML=`<h4>${col}</h4><h2 id="kpi_${i}">0</h2>`;
container.appendChild(div);
});
}

/* UPDATE KPI TOTALS */
function updateCards(){

numericColumns.forEach((col,i)=>{
let total=0;
filteredData.forEach(row=>{
let val=parseFloat(row[col]);
if(!isNaN(val)) total+=val;
});
document.getElementById("kpi_"+i).innerText=total;
});
}

/* EXPORT */
function exportToExcel(){
let ws=XLSX.utils.json_to_sheet(filteredData);
let wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Dashboard");
XLSX.writeFile(wb,"Gee_Impex_Dashboard.xlsx");
}

</script>

</body>
</html>
