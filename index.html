<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Production Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#eef2f7;}
.header{background:#0f172a;color:white;padding:18px;text-align:center;font-size:22px;font-weight:600;}
.container{padding:20px;}

.top-bar{
display:flex;
justify-content:space-between;
margin-bottom:15px;
}

input{
padding:6px 10px;
border-radius:6px;
border:1px solid #ccc;
}

button{
padding:7px 14px;
border:none;
border-radius:6px;
background:#111827;
color:white;
cursor:pointer;
}
button:hover{background:black;}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:12px;
margin-bottom:20px;
}

.card{
padding:15px;
border-radius:12px;
color:white;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.card h4{margin:0;font-size:12px;}
.card h2{margin:6px 0 0;font-size:18px;font-weight:700;}

.blue{background:#2563eb;}
.green{background:#16a34a;}
.teal{background:#0ea5e9;}
.orange{background:#f97316;}
.red{background:#dc2626;}
.purple{background:#7c3aed;}
.dark{background:#111827;}

.table-container{
background:white;
border-radius:10px;
overflow:auto;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

table{
width:100%;
border-collapse:collapse;
font-size:12px;
}

th{
background:#0f172a;
color:white;
padding:8px;
position:sticky;
top:0;
}

.filter-row th{
background:#1f2937;
}

.filter-row select{
width:100%;
padding:4px;
font-size:11px;
}

td{
padding:8px;
text-align:center;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f9fafb;
}

</style>
</head>

<body>

<div class="header">Production Dashboard</div>

<div class="container">

<div class="top-bar">
<input type="text" id="searchInput" placeholder="Search...">
<button onclick="window.print()">Print</button>
</div>

<div class="cards" id="cardsContainer"></div>

<div class="table-container">
<table id="dataTable">
<thead>
<tr id="headerRow"></tr>
<tr id="filterRow" class="filter-row"></tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let fullData=[];
let headers=[];

Papa.parse(sheetURL,{
download:true,
header:true,
skipEmptyLines:true,
complete:function(results){

fullData=results.data.filter(r=>r["Job Card No"]);
headers=Object.keys(fullData[0]);

createHeaders();
createFilters();
createCards();
applyFilters();
}
});

function createHeaders(){
let headerRow=document.getElementById("headerRow");
headers.forEach(h=>{
let th=document.createElement("th");
th.innerText=h;
headerRow.appendChild(th);
});
}

function createFilters(){
let filterRow=document.getElementById("filterRow");

headers.forEach(h=>{
let th=document.createElement("th");

let select=document.createElement("select");
select.setAttribute("data-column",h);
select.innerHTML=`<option value="">All</option>`;

let unique=[...new Set(fullData.map(r=>r[h]))].filter(v=>v);

unique.forEach(val=>{
let opt=document.createElement("option");
opt.value=val;
opt.text=val;
select.appendChild(opt);
});

select.addEventListener("change",applyFilters);

th.appendChild(select);
filterRow.appendChild(th);
});
}

function createCards(){

let kpiColumns=[
"Po Qty","Cut Qty","Line Qty","Finished Qty","Packed",
"Gpt+Cat+Sam","Rejection","Excess","Po Pendng",
"Cut Pending","Grn Qty","Amm Qty","Short Qty",
"Qc Fail Qty","Amount"
];

let colors=["blue","green","teal","purple","orange",
"red","purple","orange","teal",
"green","blue","purple","red",
"green","dark"];

let container=document.getElementById("cardsContainer");

kpiColumns.forEach((col,i)=>{
let div=document.createElement("div");
div.className="card "+colors[i];
div.innerHTML=`<h4>${col}</h4><h2 id="${col.replace(/\s/g,'')}">0</h2>`;
container.appendChild(div);
});
}

function renderTable(data){

let tbody=document.querySelector("#dataTable tbody");
tbody.innerHTML="";

let totals={};

data.forEach(row=>{

let tr="<tr>";
headers.forEach(h=>{
tr+=`<td>${row[h]||""}</td>`;
});
tr+="</tr>";
tbody.innerHTML+=tr;

headers.forEach(h=>{
if(!isNaN(row[h]) && row[h]!=""){
totals[h]=(totals[h]||0)+Number(row[h]);
}
});
});

Object.keys(totals).forEach(key=>{
let id=key.replace(/\s/g,'');
let el=document.getElementById(id);
if(el){el.innerText=totals[key];}
});
}

function applyFilters(){

let search=document.getElementById("searchInput").value.toLowerCase();
let selects=document.querySelectorAll(".filter-row select");

let filtered=fullData.filter(row=>{

let matchSearch=Object.values(row).join(" ").toLowerCase().includes(search);

let matchFilter=true;

selects.forEach(select=>{
let col=select.getAttribute("data-column");
let val=select.value;
if(val && row[col]!=val){matchFilter=false;}
});

return matchSearch && matchFilter;
});

renderTable(filtered);
}

document.getElementById("searchInput").addEventListener("keyup",applyFilters);

</script>

</body>
</html>
