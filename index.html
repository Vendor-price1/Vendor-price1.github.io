<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gee Impex Production Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#f4f6f9;}
.header{background:#000;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:600;}
.container{padding:15px;}
.controls{margin-bottom:15px;}
button{padding:6px 12px;background:#111827;color:#fff;border:none;border-radius:6px;cursor:pointer;margin-right:5px;}
input{padding:6px;border:1px solid #ccc;border-radius:6px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:15px;}
.card{background:#2563eb;color:#fff;padding:10px;border-radius:8px;text-align:center;font-weight:bold;}
table{border-collapse:collapse;width:100%;background:#fff;}
th,td{border:1px solid #ddd;padding:8px;text-align:center;font-size:13px;}
th{background:#000;color:#fff;}
tr:nth-child(even){background:#f9f9f9;}
.remark{color:#dc2626;font-weight:bold;}
tfoot{background:#e5e7eb;font-weight:bold;}
@media print{button,input{display:none;}}
</style>
</head>

<body>

<div class="header">
Gee Impex Production Dashboard
</div>

<div class="container">

<div class="controls">
<input type="text" id="searchInput" placeholder="Search...">
<button onclick="printSelected()">Print</button>
</div>

<div class="cards" id="totalCards"></div>
<table id="dataTable"></table>

</div>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let originalData=[];
let filteredData=[];
let headers=[];
let lockedRows=new Set(JSON.parse(localStorage.getItem("lockedRows")||"[]"));
let numericColumns=[];

Papa.parse(sheetURL,{
download:true,
header:true,
skipEmptyLines:true,
complete:function(results){

originalData=results.data.filter(r=>Object.values(r).some(v=>v));
filteredData=[...originalData];
headers=Object.keys(originalData[0]);

numericColumns=headers.filter(h=>{
if(h.trim().toLowerCase()=="rate") return false;
return originalData.some(r=>!isNaN(parseFloat(r[h])));
});

renderTable();
}
});

function renderTable(){

let table=document.getElementById("dataTable");
table.innerHTML="";

let thead="<tr><th>Select</th>";
headers.forEach(h=>thead+=`<th>${h}</th>`);
thead+="<th>Remark</th></tr>";
table.innerHTML=thead;

filteredData.forEach((row,index)=>{

let disabled=lockedRows.has(index)?"disabled":"";
let tr="<tr>";
tr+=`<td><input type="checkbox" ${disabled} onchange="toggleSelect(${index})"></td>`;

headers.forEach(h=>tr+=`<td>${row[h] ?? ""}</td>`);

let remark=lockedRows.has(index)?"Salary Done":"";
tr+=`<td class="remark">${remark}</td></tr>`;

table.innerHTML+=tr;
});

renderTotals();
}

function toggleSelect(index){

if(lockedRows.has(index)) return;

let pass=prompt("Enter Password:");
if(pass!=="123"){
alert("Wrong Password!");
return;
}

lockedRows.add(index);
localStorage.setItem("lockedRows",JSON.stringify([...lockedRows]));
renderTable();
}

function renderTotals(){

let container=document.getElementById("totalCards");
container.innerHTML="";

numericColumns.forEach(col=>{

let total=0;
filteredData.forEach(r=>{
let val=parseFloat(r[col]);
if(!isNaN(val)) total+=val;
});

let div=document.createElement("div");
div.className="card";
div.innerHTML=`${col}<br>${total}`;
container.appendChild(div);
});

renderFooterTotals();
}

function renderFooterTotals(){

let table=document.getElementById("dataTable");
let tfoot="<tfoot><tr><td>Total</td>";

headers.forEach(col=>{
if(numericColumns.includes(col)){
let total=0;
filteredData.forEach(r=>{
let val=parseFloat(r[col]);
if(!isNaN(val)) total+=val;
});
tfoot+=`<td>${total}</td>`;
}else{
tfoot+="<td></td>";
}
});

tfoot+="<td></td></tr></tfoot>";
table.innerHTML+=tfoot;
}

document.getElementById("searchInput").addEventListener("input",function(){
let val=this.value.toLowerCase();
filteredData=originalData.filter(row=>{
return headers.some(h=>String(row[h]??"").toLowerCase().includes(val));
});
renderTable();
});

function printSelected(){

let win=window.open("","","width=900,height=700");

let html="<h2>Gee Impex Production Report</h2>";
html+="<table border='1' cellpadding='5' cellspacing='0'>";
html+="<tr>";

headers.forEach(h=>html+=`<th>${h}</th>`);
html+="<th>Remark</th></tr>";

let totals={};
numericColumns.forEach(col=>totals[col]=0);

filteredData.forEach((row,index)=>{
if(lockedRows.has(index)){
html+="<tr>";
headers.forEach(h=>{
html+=`<td>${row[h] ?? ""}</td>`;
if(numericColumns.includes(h)){
let val=parseFloat(row[h]);
if(!isNaN(val)) totals[h]+=val;
}
});
html+="<td>Salary Done</td></tr>";
}
});

html+="<tr>";
headers.forEach(h=>{
if(numericColumns.includes(h)){
html+=`<td>${totals[h]}</td>`;
}else{
html+="<td></td>";
}
});
html+="<td>Total</td></tr>";

html+="</table>";
win.document.write(html);
win.document.close();
win.print();
}

</script>

</body>
</html>
