<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gee Impex Live Production Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#f4f6f9;
}

.header{
background:#000;
color:#fff;
padding:15px;
text-align:center;
font-size:22px;
font-weight:600;
}

.container{
padding:15px;
overflow-x:auto;
}

.top-controls{
margin-bottom:15px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

button{
padding:6px 12px;
background:#111827;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
}

input{
padding:6px;
border:1px solid #ccc;
border-radius:6px;
}

/* KPI */
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;
margin-bottom:20px;
}

.card{
padding:14px;
border-radius:10px;
color:#fff;
text-align:center;
font-weight:600;
box-shadow:0 3px 8px rgba(0,0,0,0.2);
}

.card h4{margin:0;font-size:13px;}
.card h2{margin:6px 0 0;font-size:18px;}

.color0{background:#2563eb;}
.color1{background:#16a34a;}
.color2{background:#f97316;}
.color3{background:#dc2626;}
.color4{background:#7c3aed;}
.color5{background:#111827;}

/* TABLE */
table{
border-collapse:collapse;
width:100%;
min-width:1200px;
background:#fff;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
white-space:nowrap;
}

th{
background:#000;
color:#fff;
position:relative;
font-size:13px;
}

th span{
display:block;
}

.filter-icon{
cursor:pointer;
color:#ffc107;
font-size:12px;
margin-top:4px;
}

.filter-box{
position:absolute;
top:100%;
left:0;
background:#fff;
border:1px solid #ccc;
max-height:200px;
overflow:auto;
display:none;
z-index:999;
padding:5px;
min-width:150px;
text-align:left;
color:#000;
}

tr:nth-child(even){
background:#f9f9f9;
}

.footer{
background:#000;
color:#fff;
text-align:center;
padding:10px;
margin-top:20px;
}
</style>
</head>

<body>

<div class="header">
Gee Impex Live Production Dashboard
</div>

<div class="container">

<div class="top-controls">
<input type="text" id="searchInput" placeholder="Search...">
<button onclick="resetFilters()">Reset Filters</button>
<button onclick="exportTable()">Export Excel</button>
<button onclick="window.print()">Print</button>
</div>

<div class="cards" id="cardsContainer"></div>

<table id="dataTable"></table>

</div>

<div class="footer">
Created by: Vijay Pandey
</div>

<script>

const sheetURL="YOUR_GOOGLE_SHEET_CSV_LINK_HERE";

let originalData=[];
let filteredData=[];
let headers=[];
let filters={};

function loadData(){
Papa.parse(sheetURL,{
download:true,
header:true,
skipEmptyLines:true,
complete:function(results){

originalData=results.data.filter(r=>Object.values(r).some(v=>v));
filteredData=[...originalData];
headers=Object.keys(originalData[0]);

renderTable();
}
});
}

loadData();
setInterval(loadData,60000);

/* TABLE RENDER */
function renderTable(){

let table=document.getElementById("dataTable");
table.innerHTML="";

let thead="<tr>";
headers.forEach(h=>{
thead+=`<th>
<span>${h}</span>
<span class="filter-icon" onclick="toggleFilter('${h}')">🔽</span>
<div class="filter-box" id="filter-${h}"></div>
</th>`;
});
thead+="</tr>";
table.innerHTML=thead;

filteredData.forEach(row=>{
let tr="<tr>";
headers.forEach(h=>{
tr+=`<td>${row[h] ?? ""}</td>`;
});
tr+="</tr>";
table.innerHTML+=tr;
});

createFilters();
createKPI();
}

/* FILTER CREATE */
function createFilters(){
headers.forEach(h=>{
let box=document.getElementById("filter-"+h);
box.innerHTML="";

let values=[...new Set(
originalData
.map(r=>r[h])
.filter(v=>v!==undefined && v!==null && String(v).trim()!=="")
)];

values.sort();

values.forEach(v=>{
let div=document.createElement("div");
div.innerHTML=`
<label>
<input type="checkbox" value="${v}" onchange="applyFilter()">
${v}
</label>`;
box.appendChild(div);
});
});
}

function toggleFilter(col){
document.querySelectorAll(".filter-box").forEach(b=>b.style.display="none");
let box=document.getElementById("filter-"+col);
box.style.display="block";
}

function applyFilter(){

filters={};

headers.forEach(h=>{
let checked=[...document.querySelectorAll(`#filter-${h} input:checked`)]
.map(c=>c.value);

if(checked.length>0){
filters[h]=checked;
}
});

filteredData=originalData.filter(row=>{
return Object.keys(filters).every(col=>{
return filters[col].includes(String(row[col]).trim());
});
});

renderTable();
}

/* RESET */
function resetFilters(){
filters={};
filteredData=[...originalData];
renderTable();
}

/* SEARCH */
document.getElementById("searchInput").addEventListener("input",function(){
let val=this.value.toLowerCase();
filteredData=originalData.filter(row=>{
return headers.some(h=>String(row[h] ?? "").toLowerCase().includes(val));
});
renderTable();
});

/* KPI */
function createKPI(){
let container=document.getElementById("cardsContainer");
container.innerHTML="";

let numericColumns=headers.filter(h=>{
let name=h.toLowerCase();
if(name==="rate"||name==="qty received date") return false;
return originalData.some(r=>!isNaN(parseFloat(r[h])));
});

numericColumns.forEach((col,i)=>{
let total=0;
filteredData.forEach(r=>{
let num=parseFloat(r[col]);
if(!isNaN(num)) total+=num;
});
let div=document.createElement("div");
div.className="card color"+(i%6);
div.innerHTML=`<h4>${col}</h4><h2>${total}</h2>`;
container.appendChild(div);
});
}

/* EXPORT */
function exportTable(){
let csv=headers.join(",")+"\n";
filteredData.forEach(r=>{
csv+=headers.map(h=>`"${r[h] ?? ""}"`).join(",")+"\n";
});
let blob=new Blob([csv],{type:"text/csv"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="Gee_Impex_Report.csv";
a.click();
}

</script>

</body>
</html>
