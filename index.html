<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gee Impex Salary Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#f4f6f9;
}

.header{
background:#000;
color:#fff;
padding:15px;
text-align:center;
font-size:22px;
font-weight:600;
}

.container{
padding:15px;
}

.controls{
margin-bottom:15px;
}

button{
padding:6px 12px;
background:#111827;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
margin-right:5px;
}

input{
padding:6px;
border:1px solid #ccc;
border-radius:6px;
}

.total-box{
background:#16a34a;
color:#fff;
padding:8px 15px;
border-radius:6px;
font-weight:bold;
display:inline-block;
margin-left:10px;
}

table{
border-collapse:collapse;
width:100%;
background:#fff;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
font-size:13px;
}

th{
background:#000;
color:#fff;
}

tr:nth-child(even){
background:#f9f9f9;
}

.remark{
color:#dc2626;
font-weight:bold;
}

@media print{
button,input{
display:none;
}
}
</style>
</head>

<body>

<div class="header">
Gee Impex Salary Dashboard
</div>

<div class="container">

<div class="controls">
<input type="text" id="searchInput" placeholder="Search...">
<button onclick="resetSelection()">Reset</button>
<button onclick="exportSelected()">Export</button>
<button onclick="printSelected()">Print</button>

<span class="total-box">
Total Selected: ₹ <span id="totalAmount">0</span>
</span>
</div>

<table id="dataTable"></table>

</div>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let originalData=[];
let filteredData=[];
let headers=[];
let selectedRows=new Set();
let amountColumn="";

/* LOAD DATA */
Papa.parse(sheetURL,{
download:true,
header:true,
skipEmptyLines:true,
complete:function(results){

originalData=results.data.filter(r=>Object.values(r).some(v=>v));
filteredData=[...originalData];
headers=Object.keys(originalData[0]);

// Find amount column automatically
amountColumn=headers.find(h=>
h.toLowerCase().includes("amount") ||
h.toLowerCase().includes("salary")
);

renderTable();
}
});

/* TABLE RENDER */
function renderTable(){

let table=document.getElementById("dataTable");
table.innerHTML="";

let thead="<tr><th>Select</th>";
headers.forEach(h=>thead+=`<th>${h}</th>`);
thead+="<th>Remark</th></tr>";
table.innerHTML=thead;

filteredData.forEach((row,index)=>{

let checked=selectedRows.has(index)?"checked":"";

let tr="<tr>";
tr+=`<td><input type="checkbox" ${checked} onchange="toggleSelect(${index})"></td>`;

headers.forEach(h=>{
tr+=`<td>${row[h] ?? ""}</td>`;
});

let remark=selectedRows.has(index)?"Salary Done":"";
tr+=`<td class="remark">${remark}</td></tr>`;

table.innerHTML+=tr;
});

updateTotal();
}

/* SELECT */
function toggleSelect(index){
if(selectedRows.has(index)){
selectedRows.delete(index);
}else{
selectedRows.add(index);
}
renderTable();
}

/* TOTAL */
function updateTotal(){

let total=0;

if(amountColumn){
selectedRows.forEach(i=>{
let val=parseFloat(filteredData[i][amountColumn]);
if(!isNaN(val)) total+=val;
});
}

document.getElementById("totalAmount").innerText=total;
}

/* SEARCH */
document.getElementById("searchInput").addEventListener("input",function(){
let val=this.value.toLowerCase();
filteredData=originalData.filter(row=>{
return headers.some(h=>
String(row[h] ?? "").toLowerCase().includes(val)
);
});
selectedRows.clear();
renderTable();
});

/* RESET */
function resetSelection(){
selectedRows.clear();
renderTable();
}

/* EXPORT */
function exportSelected(){

let csv=headers.join(",")+",Remark\n";

selectedRows.forEach(i=>{
let row=filteredData[i];
csv+=headers.map(h=>`"${row[h] ?? ""}"`).join(",");
csv+=',"Salary Done"\n';
});

let blob=new Blob([csv],{type:"text/csv"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="Salary_Selected.csv";
a.click();
}

/* PRINT */
function printSelected(){

let win=window.open("","","width=900,height=700");

let html="<h2>Salary Report</h2>";
html+="<table border='1' cellpadding='5' cellspacing='0'>";
html+="<tr>";

headers.forEach(h=>html+=`<th>${h}</th>`);
html+="<th>Remark</th></tr>";

selectedRows.forEach(i=>{
let row=filteredData[i];
html+="<tr>";
headers.forEach(h=>html+=`<td>${row[h] ?? ""}</td>`);
html+="<td>Salary Done</td></tr>";
});

html+="</table>";

win.document.write(html);
win.document.close();
win.print();
}

</script>

</body>
</html>
