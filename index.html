<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gee Impex Live Production Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#eef2f7;}

.header{
background:#000;
color:white;
padding:12px;
text-align:center;
position:relative;
}

.title{font-size:22px;font-weight:600;}

.clock{
position:absolute;
right:20px;
top:15px;
font-size:14px;
}

.container{padding:15px;}

.top-bar{
display:flex;
justify-content:flex-end;
gap:10px;
margin-bottom:15px;
flex-wrap:wrap;
}

button{
padding:6px 12px;
border:none;
border-radius:6px;
background:#111827;
color:white;
cursor:pointer;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;
margin-bottom:20px;
}

.card{
padding:15px;
border-radius:10px;
color:white;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.card h4{margin:0;font-size:12px;}
.card h2{margin:6px 0 0;font-size:18px;font-weight:700;}

.color0{background:#2563eb;}
.color1{background:#16a34a;}
.color2{background:#f97316;}
.color3{background:#dc2626;}
.color4{background:#7c3aed;}
.color5{background:#111827;}

.footer{
background:#000;
color:white;
text-align:center;
padding:10px;
margin-top:20px;
font-size:13px;
}

table.dataTable thead{
background:black;
color:white;
}

@media print{
.top-bar,.clock,.dataTables_filter,.dataTables_length,.dataTables_paginate{display:none;}
}
</style>
</head>

<body>

<div class="header">
<div class="title">Gee Impex Live Production Dashboard</div>
<div class="clock" id="clock"></div>
</div>

<div class="container">

<div class="top-bar">
<button onclick="exportToExcel()">Export Excel</button>
<button onclick="window.print()">Print</button>
</div>

<div class="cards" id="cardsContainer"></div>

<table id="dataTable" class="display" style="width:100%"></table>

</div>

<div class="footer">
Created by: Vijay Pandey
</div>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let fullData=[];
let numericColumns=[];
let table;

/* CLOCK */
function updateClock(){
let now=new Date();
document.getElementById("clock").innerText=
now.toLocaleDateString()+" "+now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

/* LOAD DATA */
function loadData(){
Papa.parse(sheetURL,{
download:true,
header:true,
skipEmptyLines:true,
complete:function(res){

fullData=res.data.filter(r=>Object.values(r).some(v=>v));

if(fullData.length==0) return;

let headers=Object.keys(fullData[0]);

numericColumns=headers.filter(h=>{
if(h.toLowerCase()=="rate") return false;   // RATE BOX REMOVE
return fullData.some(r=>!isNaN(parseFloat(r[h])));
});

createCards(headers);

if(table){
table.clear().rows.add(fullData).draw();
}else{
table=$('#dataTable').DataTable({
data:fullData,
columns:headers.map(h=>({title:h,data:h})),
destroy:true
});
}

updateCards();
}
});
}

loadData();
setInterval(loadData,60000);

/* CARDS */
function createCards(headers){

let container=document.getElementById("cardsContainer");
container.innerHTML="";

numericColumns.forEach((col,i)=>{
let div=document.createElement("div");
div.className="card color"+(i%6);
div.innerHTML=`<h4>${col}</h4><h2 id="kpi_${col}">0</h2>`;
container.appendChild(div);
});
}

function updateCards(){

numericColumns.forEach(col=>{
let total=0;
fullData.forEach(r=>{
let num=parseFloat(r[col]);
if(!isNaN(num)) total+=num;
});
let el=document.getElementById("kpi_"+col);
if(el) el.innerText=total;
});
}

/* EXPORT */
function exportToExcel(){
let ws=XLSX.utils.json_to_sheet(fullData);
let wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Dashboard");
XLSX.writeFile(wb,"Gee_Impex_Dashboard.xlsx");
}

</script>

</body>
</html>
