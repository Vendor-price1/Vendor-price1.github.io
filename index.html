<!DOCTYPE html>
<html>
<head>
<title>Gee Impex Production Dashboard</title>

<style>
body{
font-family: "Segoe UI", Arial;
background:#0f172a;
padding:15px;
}

/* TABLE WRAPPER */
#dashboard{
background:#f8fafc;
padding:10px;
border-radius:10px;
box-shadow:0 8px 25px rgba(0,0,0,.4);
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:8px;
overflow:hidden;
}

/* HEADER */
th{
background:#0f172a;
color:#fff;
padding:8px;
font-size:14px;   /* HEADER FONT */
border:1px solid #1f2937;
text-align:center;
position:sticky;
top:0;
}

/* DATA CELL */
td{
border:1px solid #d1d5db;
padding:6px;
font-size:13px;   /* DATA FONT SLIGHTLY BIG */
}

/* LEFT ALIGN TEXT COLUMNS */
td.text-left{
text-align:left;
font-weight:500;
}

/* CENTER ALIGN NUMBERS */
td.num{
text-align:center;
}

/* STRIPED ROWS */
tbody tr:nth-child(even){
background:#f3f4f6;
}
tbody tr:hover{
background:#dbeafe;
}

/* TOTAL ROW */
tfoot td{
background:#0f172a;
color:#fff;
font-weight:bold;
border:1px solid #1f2937;
font-size:14px;
}

/* TITLE */
h2{
color:white;
text-align:center;
margin-bottom:8px;
}
</style>
</head>

<body>

<h2>📊 Gee Impex Production Report</h2>

<div id="dashboard">
<table id="dataTable">
<thead></thead>
<tbody></tbody>
<tfoot></tfoot>
</table>
</div>

<script>
// GOOGLE SHEET CSV LINK
const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let headers=[], rows=[];

// LOAD DATA
fetch(sheetURL).then(r=>r.text()).then(data=>{
let csv=data.split("\n").map(r=>r.split(","));
headers=csv[0];
rows=csv.slice(1);
buildTable();
});

// BUILD TABLE
function buildTable(){
let thead="<tr>";
headers.forEach(h=>{
thead+="<th>"+h+"</th>";
});
thead+="</tr>";
document.querySelector("thead").innerHTML=thead;

let tbody="";
rows.forEach(r=>{
tbody+="<tr>";
r.forEach((c,i)=>{
let col=headers[i];

let cls="num";
if(col=="Job Card No" || col=="Brand Name" || col=="Vendor Article Number"){
cls="text-left";
}
tbody+=`<td class="${cls}">${c}</td>`;
});
tbody+="</tr>";
});
document.querySelector("tbody").innerHTML=tbody;

calculateTotals();
}

// TOTAL ROW
function calculateTotals(){
let totals=new Array(headers.length).fill(0);

rows.forEach(r=>{
r.forEach((c,i)=>{
let v=parseFloat(c);
if(!isNaN(v)) totals[i]+=v;
});
});

let html="<tr>";
headers.forEach((h,i)=>{
if(i==0){
html+="<td class='text-left'>TOTAL</td>";
}else{
html+="<td class='num'>"+(totals[i]||"")+"</td>";
}
});
html+="</tr>";
document.querySelector("tfoot").innerHTML=html;
}
</script>

</body>
</html>
