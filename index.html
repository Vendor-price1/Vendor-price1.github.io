<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let fullData=[];
let headers=[];
let activeFilters={};

Papa.parse(sheetURL,{
download:true,
header:true,
skipEmptyLines:true,
complete:function(results){

if(!results.data || results.data.length===0){
document.body.innerHTML="<h2 style='text-align:center;margin-top:50px'>No Data Found</h2>";
return;
}

fullData=results.data.filter(row=>{
return Object.values(row).some(v=>v && v.trim()!=="");
});

if(fullData.length===0){
document.body.innerHTML="<h2 style='text-align:center;margin-top:50px'>Sheet Empty</h2>";
return;
}

headers=Object.keys(fullData[0]);

createHeaders();
createCards();
applyFilters();
}
});

function renderTable(data){

let tbody=document.querySelector("#dataTable tbody");
tbody.innerHTML="";

let totals={};

data.forEach(row=>{

let tr="<tr>";

headers.forEach(h=>{
tr+=`<td>${row[h]||""}</td>`;

let val=parseFloat(row[h]);
if(!isNaN(val)){
totals[h]=(totals[h]||0)+val;
}
});

tr+="</tr>";
tbody.innerHTML+=tr;
});

Object.keys(totals).forEach(key=>{
let id=key.replace(/\s/g,'');
let el=document.getElementById(id);
if(el){
el.innerText=totals[key];
}
});
}
</script>
