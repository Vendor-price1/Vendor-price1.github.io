<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gee Impex Production Dashboard</title>

<style>
body{
font-family:Arial;
margin:0;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
}

/* LOGIN SCREEN */
#loginBox{
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

.login-card{
background:#111827;
padding:30px;
border-radius:10px;
box-shadow:0 0 20px rgba(0,0,0,0.6);
width:300px;
text-align:center;
}

.login-card h2{
margin-bottom:15px;
color:#38bdf8;
}

.login-card input{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:5px;
}

.login-card button{
width:100%;
padding:10px;
background:#38bdf8;
border:none;
border-radius:5px;
cursor:pointer;
font-weight:bold;
}

/* DASHBOARD STYLE */
.dashboard{
padding:15px;
display:none;
}

h1{text-align:center;color:#38bdf8;}

.controls{
margin-bottom:15px;
}

button{
padding:6px 12px;
margin-right:8px;
cursor:pointer;
border:none;
border-radius:4px;
background:#2563eb;
color:white;
}

input[type="text"]{
padding:6px;
width:200px;
margin-right:10px;
border-radius:4px;
border:none;
}

table{
border-collapse:collapse;
width:100%;
background:white;
color:black;
border-radius:8px;
overflow:hidden;
}

th,td{
border:1px solid #ccc;
padding:6px;
text-align:center;
}

th{
background:#111827;
color:white;
}

tfoot{
background:#e5e7eb;
font-weight:bold;
}

.locked{
background:#d3d3d3 !important;
}

.kpi-container{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

.kpi{
background:#16a34a;
color:white;
padding:10px;
border-radius:6px;
min-width:120px;
text-align:center;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,0.4);
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginBox">
<div class="login-card">
<h2>Gee Impex Login</h2>
<input type="text" id="loginId" placeholder="User ID">
<input type="password" id="loginPass" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMsg" style="color:red;"></p>
</div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

<h1>Gee Impex Production Dashboard</h1>

<div class="controls">
<input type="text" id="searchInput" placeholder="Search..." onkeyup="searchTable()">
<button onclick="printSelected()">Print Selected</button>
<button onclick="exportExcel()">Export Excel</button>
</div>

<div class="kpi-container" id="kpis"></div>

<table id="dataTable">
<thead></thead>
<tbody></tbody>
<tfoot></tfoot>
</table>

</div>

<script>
// ================= LOGIN SYSTEM =================

const USER_ID="vijay";
const USER_PASS="0011";

function login(){
let id=document.getElementById("loginId").value;
let pass=document.getElementById("loginPass").value;

if(id===USER_ID && pass===USER_PASS){
document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="block";
loadDashboard();
}else{
document.getElementById("loginMsg").innerText="Wrong ID or Password!";
}
}

// ================= DASHBOARD DATA =================

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

const LOCK_PASSWORD="123";
const UNLOCK_PASSWORD="321";

let lockedRows=JSON.parse(localStorage.getItem("lockedRows"))||{};
let headers=[];

function loadDashboard(){

fetch(sheetURL)
.then(res=>res.text())
.then(data=>{

let rows=data.split("\n").map(r=>r.split(","));
headers=rows[0];
let bodyRows=rows.slice(1);

let thead="<tr><th>Select</th>";
headers.forEach(h=>thead+="<th>"+h+"</th>");
thead+="<th>Action</th></tr>";
document.querySelector("thead").innerHTML=thead;

let tbody="";

bodyRows.forEach((row,index)=>{

if(row.length<headers.length) return;
let rowId=index;

tbody+=`<tr id="row${rowId}" class="${lockedRows[rowId]?"locked":""}">`;

tbody+=`<td>
<input type="checkbox" 
${lockedRows[rowId]?"checked":""}
onchange="handleCheckbox(this,${rowId})">
</td>`;

row.forEach(cell=>{
tbody+="<td>"+cell+"</td>";
});

tbody+=`<td><button onclick="unlockRow(${rowId})">Unlock</button></td>`;
tbody+="</tr>";
});

document.querySelector("tbody").innerHTML=tbody;
updateTotals();
});
}

// ================= TOTALS =================

function updateTotals(){
let totals=new Array(headers.length).fill(0);
let rows=document.querySelectorAll("tbody tr");

rows.forEach(row=>{
if(row.style.display==="none") return;
let cells=row.querySelectorAll("td");
for(let i=1;i<=headers.length;i++){
let val=parseFloat(cells[i].innerText);
if(!isNaN(val)) totals[i-1]+=val;
}
});

generateTotals(headers,totals);
generateKPIs(headers,totals);
}

function generateTotals(headers,totals){
let footer="<tr><td>Total</td>";
headers.forEach((h,i)=>{
if(h.trim()=="Qty Received Date"||h.trim()=="Rate"){
footer+="<td></td>";
}else{
footer+="<td>"+(totals[i]||"")+"</td>";
}
});
footer+="<td></td></tr>";
document.querySelector("tfoot").innerHTML=footer;
}

function generateKPIs(headers,totals){
let html="";
headers.forEach((h,i)=>{
if(h.trim()=="Qty Received Date"||h.trim()=="Rate") return;
if(!isNaN(totals[i])&&totals[i]!=0){
html+=`<div class="kpi">${h}<br>${totals[i]}</div>`;
}
});
document.getElementById("kpis").innerHTML=html;
}

// ================= LOCK SYSTEM =================

function handleCheckbox(cb,rowId){
if(lockedRows[rowId]){
alert("Row Already Locked");
cb.checked=true;
return;
}

if(cb.checked){
let pass=prompt("Enter Lock Password (123)");
if(pass===LOCK_PASSWORD){
lockedRows[rowId]=true;
localStorage.setItem("lockedRows",JSON.stringify(lockedRows));
document.getElementById("row"+rowId).classList.add("locked");
}else{
alert("Wrong Password");
cb.checked=false;
}
}
}

function unlockRow(rowId){
if(!lockedRows[rowId]){
alert("Row Not Locked");
return;
}
let pass=prompt("Enter Unlock Password (321)");
if(pass===UNLOCK_PASSWORD){
delete lockedRows[rowId];
localStorage.setItem("lockedRows",JSON.stringify(lockedRows));
location.reload();
}else{
alert("Wrong Password");
}
}

// ================= SEARCH =================

function searchTable(){
let input=document.getElementById("searchInput").value.toLowerCase();
let rows=document.querySelectorAll("tbody tr");
rows.forEach(row=>{
let text=row.innerText.toLowerCase();
row.style.display=text.includes(input)?"":"none";
});
updateTotals();
}

// ================= PRINT =================

function printSelected(){
let selected=document.querySelectorAll("tbody input[type='checkbox']:checked");
if(selected.length==0){alert("Select rows");return;}

let totals=new Array(headers.length).fill(0);
let html="<table border='1' style='width:100%;border-collapse:collapse'><tr>";
document.querySelectorAll("thead th").forEach(th=>html+="<th>"+th.innerText+"</th>");
html+="</tr>";

selected.forEach(cb=>{
let row=cb.closest("tr");
html+=row.outerHTML;
let cells=row.querySelectorAll("td");
for(let i=1;i<=headers.length;i++){
let val=parseFloat(cells[i].innerText);
if(!isNaN(val)) totals[i-1]+=val;
}
});

html+="<tr style='font-weight:bold;background:#eee'><td>Total</td>";
headers.forEach((h,i)=>{
if(h.trim()=="Qty Received Date"||h.trim()=="Rate") html+="<td></td>";
else html+="<td>"+(totals[i]||"")+"</td>";
});
html+="<td></td></tr></table>";

let win=window.open("");
win.document.write("<h2>Gee Impex Production Report</h2>"+html);
win.print();
}

// ================= EXPORT =================

function exportExcel(){
let table=document.getElementById("dataTable").outerHTML;
let blob=new Blob([table],{type:"application/vnd.ms-excel"});
let link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download="Gee_Impex_Production_Data.xls";
link.click();
}

</script>

</body>
</html>
