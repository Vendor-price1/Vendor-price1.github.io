<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gee Impex Live Production Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Segoe UI;
background:#eef2f7;
-webkit-print-color-adjust: exact;
print-color-adjust: exact;
}

/* HEADER */
.header{
background:#000;
color:white;
padding:12px 20px;
display:flex;
align-items:center;
justify-content:space-between;
flex-wrap:wrap;
}

.header-left{
display:flex;
align-items:center;
gap:15px;
}

.logo{
height:45px;
}

.title{
font-size:20px;
font-weight:600;
}

.clock{
font-size:14px;
}

/* CONTAINER */
.container{
padding:15px;
}

/* TOP BAR */
.top-bar{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
gap:10px;
margin-bottom:15px;
}

input{
padding:6px 10px;
border-radius:6px;
border:1px solid #ccc;
}

button{
padding:6px 12px;
border:none;
border-radius:6px;
background:#111827;
color:white;
cursor:pointer;
}

/* CARDS */
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;
margin-bottom:20px;
}

.card{
padding:12px;
border-radius:10px;
color:white;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
text-align:center;
}

.card h4{margin:0;font-size:11px;}
.card h2{margin:5px 0 0;font-size:16px;font-weight:700;}

.blue{background:#2563eb;}
.green{background:#16a34a;}
.orange{background:#f97316;}
.red{background:#dc2626;}
.purple{background:#7c3aed;}
.dark{background:#111827;}

/* TABLE */
.table-container{
background:white;
border-radius:10px;
overflow:auto;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

table{
width:100%;
border-collapse:collapse;
font-size:11px;
min-width:900px;
}

th{
background:#000;
color:white;
padding:8px;
text-align:center;
position:sticky;
top:0;
}

td{
padding:6px;
text-align:center;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f9fafb;
}

/* FOOTER */
.footer{
background:#000;
color:white;
text-align:center;
padding:10px;
margin-top:20px;
font-size:13px;
}

/* MOBILE */
@media(max-width:768px){
.title{
font-size:16px;
}
.logo{
height:35px;
}
}

/* PRINT */
@media print{
.top-bar{display:none;}
.clock{display:none;}
button{display:none;}
}
</style>
</head>

<body>

<div class="header">
<div class="header-left">
<img src="logo.png" class="logo">
<div class="title">Gee Impex Live Production Dashboard</div>
</div>
<div class="clock" id="clock"></div>
</div>

<div class="container">

<div class="top-bar">
<input type="text" id="searchInput" placeholder="Search...">
<div>
<button onclick="exportToExcel()">Export Excel</button>
<button onclick="window.print()">Print</button>
</div>
</div>

<div class="cards" id="cardsContainer"></div>

<div class="table-container">
<table id="dataTable">
<thead><tr id="headerRow"></tr></thead>
<tbody></tbody>
</table>
</div>

</div>

<div class="footer">
Created by: Vijay Pandey
</div>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let fullData=[];
let headers=[];
let filteredData=[];

/* LIVE CLOCK */
function updateClock(){
let now=new Date();
document.getElementById("clock").innerText=
now.toLocaleDateString()+" "+now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

/* LOAD DATA */
function loadData(){
Papa.parse(sheetURL,{
download:true,
header:true,
skipEmptyLines:true,
complete:function(results){

fullData=results.data.filter(row=>{
return Object.values(row).some(v=>v && v.trim()!=="");
});

if(fullData.length===0){
alert("No Data Found");
return;
}

headers=Object.keys(fullData[0]);

createHeaders();
createCards();
applyFilters();
}
});
}

loadData();

/* AUTO REFRESH 1 MIN */
setInterval(loadData,60000);

function createHeaders(){
let headerRow=document.getElementById("headerRow");
headerRow.innerHTML="";
headers.forEach(h=>{
let th=document.createElement("th");
th.innerText=h;
headerRow.appendChild(th);
});
}

function createCards(){

let kpiColumns=[
"Po Qty","Cut Qty","Line Qty","Finished Qty","Packed",
"Gpt+Cat+Sam","Rejection","Excess","Po Pendng",
"Cut Pending","Grn Qty","Amm Qty","Short Qty",
"Qc Fail Qty","Amount"
];

let colors=["blue","green","purple","orange","red",
"purple","red","orange","green",
"blue","purple","orange","red",
"green","dark"];

let container=document.getElementById("cardsContainer");
container.innerHTML="";

kpiColumns.forEach((col,i)=>{
let div=document.createElement("div");
div.className="card "+colors[i];
div.innerHTML=`<h4>${col}</h4><h2 id="${col.replace(/\s/g,'')}">0</h2>`;
container.appendChild(div);
});
}

function renderTable(data){

filteredData=data;

let tbody=document.querySelector("#dataTable tbody");
tbody.innerHTML="";

let totals={};

data.forEach(row=>{

let tr="<tr>";

headers.forEach(h=>{
let val=row[h]||"";
tr+=`<td>${val}</td>`;

let num=parseFloat(val);
if(!isNaN(num)){
totals[h]=(totals[h]||0)+num;
}
});

tr+="</tr>";
tbody.innerHTML+=tr;
});

Object.keys(totals).forEach(key=>{
let el=document.getElementById(key.replace(/\s/g,''));
if(el){ el.innerText=totals[key]; }
});
}

function applyFilters(){

let search=document.getElementById("searchInput").value.toLowerCase();

let filtered=fullData.filter(row=>{
return Object.values(row)
.join(" ")
.toLowerCase()
.includes(search);
});

renderTable(filtered);
}

document.getElementById("searchInput").addEventListener("keyup",applyFilters);

/* EXPORT TO EXCEL */
function exportToExcel(){

let ws=XLSX.utils.json_to_sheet(filteredData);
let wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Dashboard");
XLSX.writeFile(wb,"Gee_Impex_Dashboard.xlsx");
}

</script>

</body>
</html>
