<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gee Impex Production Dashboard</title>

<style>
body{
font-family:Arial;
margin:0;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
}

/* LOGIN */
#loginBox{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.9);
display:flex;align-items:center;justify-content:center;
z-index:9999;
}
.login-card{
background:#111827;padding:30px;border-radius:10px;width:320px;
box-shadow:0 0 25px black;text-align:center;
}
.login-card input{
width:100%;padding:10px;margin:8px 0;border:none;border-radius:5px;
}
.login-card button{
width:100%;padding:10px;background:#38bdf8;border:none;border-radius:5px;
font-weight:bold;cursor:pointer;
}
.login-card h2{color:#38bdf8;}

/* DASHBOARD */
.dashboard{padding:15px;display:none;}
h1{text-align:center;color:#38bdf8;}

/* TABLE */
table{
border-collapse:collapse;
width:100%;
background:white;
color:black;
border-radius:8px;
overflow:hidden;
}
th,td{
border:1px solid #ccc;
padding:6px;
text-align:center;
}
th{
background:#111827;
color:white;
}
.locked{
background:#c7f9cc !important;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
<div class="login-card">
<h2>Gee Impex Login</h2>
<input type="text" id="loginId" placeholder="User ID">
<input type="password" id="loginPass" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMsg" style="color:red;"></p>
</div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
<h1>Gee Impex Production Dashboard</h1>

<table id="dataTable">
<thead></thead>
<tbody></tbody>
</table>

</div>

<script>
// LOGIN
const USER_ID="vijay";
const USER_PASS="0011";

function login(){
if(loginId.value===USER_ID && loginPass.value===USER_PASS){
loginBox.style.display="none";
dashboard.style.display="block";
loadDashboard();
}else{
loginMsg.innerText="Wrong ID or Password!";
}
}

// GOOGLE SCRIPT API (STATUS UPDATE)
const API_URL="https://script.google.com/macros/s/AKfycbx3zgoMyJs6vXc9PQR0hHW27Hl2mhR_KI50sSBTqhpEucXKC2zU6Tj2ulGMEzNURm2Fxw/exec";

// GOOGLE SHEET CSV
const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSVKYDXr85mWllfa_ZgSALzAhr4Rb90KicCCihCF4Fm80c3_jx8873MFxQGcn7wmTACfiF4woe8Buje/pub?gid=0&single=true&output=csv";

let headers=[];

// LOAD DATA
function loadDashboard(){
fetch(sheetURL).then(r=>r.text()).then(data=>{
let rows=data.split("\n").map(r=>r.split(","));
headers=rows[0];
let bodyRows=rows.slice(1);

// HEADER
let thead="<tr>";
headers.forEach(h=>{
if(h=="Rate"||h=="Amount"||h=="Status") return; // REMOVE THESE
thead+="<th>"+h+"</th>";
});
thead+="</tr>";
document.querySelector("thead").innerHTML=thead;

// BODY
let tbody="";
bodyRows.forEach((row,index)=>{
if(row.length<headers.length) return;
tbody+=`<tr id="row${index}">`;

row.forEach((cell,i)=>{
let h=headers[i];
if(h=="Rate"||h=="Amount"||h=="Status") return;
tbody+=`<td>${cell}</td>`;
});

tbody+="</tr>";
});

document.querySelector("tbody").innerHTML=tbody;
});
}
</script>

</body>
</html>
